<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Летописи: 1812</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0805; overflow: hidden; font-family: Georgia, serif; }
  /* Сцена всегда в целое число раз больше 320x180 (переменная --s): пиксели остаются чёткими */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: calc(var(--s) * 320px); height: calc(var(--s) * 180px); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud, #hint, #newgame, #dbg, #back { position: absolute; color: #f0e2c0; font-size: calc(var(--s) * 5px); text-shadow: 1px 1px #000; }
  #hud { right: calc(var(--s) * 4px); top: calc(var(--s) * 3px); text-align: right; }
  #night { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: #05070d; color: #f0e2c0;
           font-size: calc(var(--s) * 9px); opacity: 0; pointer-events: none; transition: opacity .6s; }
  #night.on { opacity: 1; pointer-events: auto; }
  #hint { left: 0; right: 0; top: calc(var(--s) * 13px); text-align: center; display: none; }
  #newgame { left: calc(var(--s) * 4px); top: calc(var(--s) * 3px); background: none; border: 1px solid #f0e2c066;
             font-family: inherit; opacity: .6; cursor: pointer; }
  #dbg { left: calc(var(--s) * 4px); top: calc(var(--s) * 15px); color: #c9b98a; opacity: .75; }
  #back { display: none; left: calc(var(--s) * 4px); top: calc(var(--s) * 3px); font-family: inherit; cursor: pointer; text-shadow: none;
          background: rgba(20,12,6,.92); border: calc(var(--s) * 1px) solid #8c7647; padding: calc(var(--s) * 1.5px) calc(var(--s) * 5px); }
  body.serving #newgame, body.serving #notesbtn { display: none; }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--s) * 24px); display: none; z-index: 5;
           background: rgba(20,12,6,.92); border: 2px solid #e8c36a; color: #f0e2c0; padding: calc(var(--s) * 2px) calc(var(--s) * 6px);
           font-size: calc(var(--s) * 6px); }
  #notes { position: absolute; inset: calc(var(--s) * 10px) calc(var(--s) * 30px); display: none; overflow: auto; box-sizing: border-box; z-index: 4;
           background: rgba(20,12,6,.96); border: 2px solid #c9a96a; color: #f0e2c0; padding: calc(var(--s) * 4px) calc(var(--s) * 8px);
           font-size: calc(var(--s) * 6px); line-height: 1.35; }
  #notes h3 { margin: 0 0 calc(var(--s) * 3px); } #notes p { margin: 0 0 calc(var(--s) * 3px); }
  #notesbtn { position: absolute; left: calc(var(--s) * 52px); top: calc(var(--s) * 3px); background: none; border: 1px solid #f0e2c066;
              color: #f0e2c0; font-family: inherit; font-size: calc(var(--s) * 5px); opacity: .6; cursor: pointer; }
  /* Режим обслуживания (по макету): портрет слева внизу, реплика внизу, панель справа. Всё размещено в долях сетки 320x180. */
  #dlg { position: absolute; inset: 0; display: none; pointer-events: none; }
  #dlg > * { pointer-events: auto; }
  #portrait { position: absolute; left: 0; bottom: 0; width: calc(var(--s) * 120px); height: calc(var(--s) * 136px); display: none; pointer-events: none; }
  #portrait img { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: contain; object-position: left bottom; }
  #portrait .ph { position: absolute; left: 0; bottom: 0; width: 62%; height: 80%; opacity: .8; display: flex; align-items: center; justify-content: center;
                  font-size: calc(var(--s) * 40px); color: #f0e2c0aa; border: calc(var(--s) * 1px) solid #8c7647; border-bottom: 0; box-sizing: border-box; }
  #col { position: absolute; left: calc(var(--s) * 118px); right: calc(var(--s) * 4px); bottom: calc(var(--s) * 4px); display: flex; flex-direction: column; gap: calc(var(--s) * 2px); }
  body.paneled #col { right: calc(var(--s) * 92px); }
  #box { background: rgba(20,12,6,.94); border: calc(var(--s) * 1px) solid #8c7647; color: #f0e2c0; white-space: pre-line;
         padding: calc(var(--s) * 3px) calc(var(--s) * 6px); min-height: calc(var(--s) * 22px); font-size: calc(var(--s) * 6px); line-height: 1.35; }
  #who { color: #e8c36a; font-weight: bold; font-size: calc(var(--s) * 7px); }
  #who:empty { display: none; }
  #choices { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 2px); }
  #choices button, #pact button { font: inherit; font-size: calc(var(--s) * 5.5px); padding: calc(var(--s) * 2px) calc(var(--s) * 3px); cursor: pointer;
                  background: rgba(20,12,6,.94); color: #f0e2c0; border: calc(var(--s) * 1px) solid #8c7647; flex: 1 1 auto; }
  #choices button:hover, #pact button:hover, #back:hover { border-color: #e8c36a; }
  #choices button:disabled { opacity: .4; cursor: not-allowed; }
  #pact button:first-child.main { background: #c9a96a; color: #1a1008; font-weight: bold; }
  #panel { position: absolute; right: calc(var(--s) * 4px); top: calc(var(--s) * 17px); width: calc(var(--s) * 84px); box-sizing: border-box; display: none;
           flex-direction: column; background: rgba(20,12,6,.94); border: calc(var(--s) * 1px) solid #8c7647; color: #f0e2c0;
           padding: calc(var(--s) * 2.5px); font-size: calc(var(--s) * 5.5px); line-height: 1.25; }
  #panel.full { bottom: calc(var(--s) * 3px); overflow-y: auto; }
  #panel i { opacity: .7; font-size: calc(var(--s) * 4.5px); line-height: 1.15; display: block; }
  #panel .head { display: flex; gap: calc(var(--s) * 3px); align-items: center; margin-bottom: calc(var(--s) * 2px); }
  #panel .gi { flex: none; width: calc(var(--s) * 20px); height: calc(var(--s) * 20px); border: calc(var(--s) * 1px) solid #8c7647; box-sizing: border-box; }
  #panel .gi img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel .row { display: flex; justify-content: space-between; align-items: center; }
  #panel .step { display: flex; align-items: center; justify-content: space-between; margin: calc(var(--s) * 1px) 0; }
  #panel .step button { font: inherit; font-size: calc(var(--s) * 6px); width: calc(var(--s) * 14px); cursor: pointer; background: rgba(20,12,6,.94); color: #f0e2c0; border: calc(var(--s) * 1px) solid #8c7647; }
  #panel .step b { font-size: calc(var(--s) * 8px); }
  #pact { margin-top: auto; display: flex; flex-direction: column; gap: calc(var(--s) * 1.5px); padding-top: calc(var(--s) * 2px); }
  #pact button { padding: calc(var(--s) * 1.5px) calc(var(--s) * 3px); }
  /* Карта: экран поверх сцены. Сама карта — SVG в рамке 1000×560 (растягивается на всю сцену), карточка места — HTML */
  #mapbtn { position: absolute; left: calc(var(--s) * 89px); top: calc(var(--s) * 3px); background: none; border: 1px solid #f0e2c066;
            color: #f0e2c0; font-family: inherit; font-size: calc(var(--s) * 5px); opacity: .6; cursor: pointer; }
  body.serving #mapbtn { display: none; }
  #map { position: absolute; inset: 0; display: none; z-index: 6; background: #0b0805; overflow: hidden; }
  #map svg { width: 100%; height: 100%; display: block; font-family: Georgia, serif; }
  #map .loc { cursor: pointer; }
  #map .loc:hover .dot { stroke: #fff; }
  #mapclose { position: absolute; left: calc(var(--s) * 4px); top: calc(var(--s) * 3px); font-family: inherit; cursor: pointer; color: #f0e2c0;
              font-size: calc(var(--s) * 5px); background: rgba(20,12,6,.92); border: calc(var(--s) * 1px) solid #8c7647; padding: calc(var(--s) * 1.5px) calc(var(--s) * 5px); }
  #mapswitch { position: absolute; left: calc(var(--s) * 60px); top: calc(var(--s) * 3px); font-family: inherit; cursor: pointer; color: #f0e2c0;
               font-size: calc(var(--s) * 5px); background: rgba(20,12,6,.92); border: calc(var(--s) * 1px) solid #8c7647; padding: calc(var(--s) * 1.5px) calc(var(--s) * 5px); }
  #mapclose:hover, #mapswitch:hover { border-color: #e8c36a; }
  #mapcard { position: absolute; left: calc(var(--s) * 4px); bottom: calc(var(--s) * 4px); width: calc(var(--s) * 92px); box-sizing: border-box;
             background: rgba(20,12,6,.94); border: calc(var(--s) * 1px) solid #8c7647; color: #f0e2c0; padding: calc(var(--s) * 3px) calc(var(--s) * 4px);
             font-size: calc(var(--s) * 5.5px); line-height: 1.3; }
  #mapcard b { color: #e8c36a; font-size: calc(var(--s) * 6.5px); display: block; }
  #mapcard i { opacity: .7; font-size: calc(var(--s) * 4.5px); display: block; margin-bottom: calc(var(--s) * 1.5px); }
  #mapcard p { margin: calc(var(--s) * 1.5px) 0 0; }
  #mapgo { font: inherit; cursor: pointer; background: #c9a96a; color: #1a1008; font-weight: bold; border: calc(var(--s) * 1px) solid #8c7647;
           padding: calc(var(--s) * 1.5px) calc(var(--s) * 5px); width: 100%; }
  #mapgo:hover { border-color: #e8c36a; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="newgame">Новая игра</button><button id="notesbtn">Заметки (N)</button><button id="mapbtn">Карта (M)</button><button id="back">← Отойти от прилавка</button>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="dbg"></div>
  <div id="dlg"><div id="portrait"></div><div id="col"><div id="box"><div id="who"></div><div id="text"></div></div><div id="choices"></div></div><div id="panel"></div></div>
  <div id="toast"></div><div id="notes"></div><div id="night"></div>
  <div id="map"><svg viewBox="0 0 1000 560" preserveAspectRatio="none"><g id="mapbase"></g><g id="mapmarks"></g></svg><button id="mapclose">← Вернуться (M)</button><button id="mapswitch"></button><div id="mapcard"></div></div>
</div>
<script src="data.js"></script>
<script>
// ================= ПРОВЕРКА data.js (чтобы вместо чёрного экрана было понятное сообщение) =================
if (typeof DATA_VERSION === 'undefined' || DATA_VERSION !== 12) {
  const why = typeof DATA_VERSION === 'undefined'
    ? 'Рядом с index.html не найден data.js или он старой версии.'
    : 'Файл data.js от другой версии игры.';
  document.getElementById('stage').style.display = 'none';
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;color:#f0e2c0;font:20px/1.5 Georgia,serif;text-align:center;';
  box.innerHTML = '<div style="max-width:640px"><b>Игра не может запуститься.</b><br>' + why +
    '<br><br>Что сделать: скачайте актуальные <b>index.html</b> и <b>data.js</b> вместе (лучше всего через Code → Download ZIP на GitHub), положите в одну папку и удалите копии вроде «data (1).js». Затем обновите страницу (F5).</div>';
  document.body.appendChild(box);
  throw new Error('data.js не найден или не той версии');
}

// ================= НАСТРОЙКИ ЭКРАНА =================
const W = 320, H = 180;                                // утверждённая сетка пикселей (экран)
// Текущая сцена: лавка (SCENE в data.js) или другое место из SCENES. Ширина мира, линия пола и границы ходьбы берутся из неё.
const scn = () => state.scene === 'shop' ? SCENE : SCENES[state.scene];
const inShop = () => state.scene === 'shop';
const LANE = SCENE.lane;                               // линия пола лавки
const floorX = () => { const c = scn(); return { l: c.walkMin, r: c.walkMax !== undefined ? c.walkMax : c.worldW - c.walkMin }; };   // без walkMax — симметрично
const speakers = () => [...CUSTOMERS, MOTHER, ...Object.values(SCENES).flatMap(c => c.npcs || [])];

// ================= РАЗГОВОРЫ И ТОРГОВЛЯ (логика; реплики, числа и условия — в data.js) =================
// ----- Дни и части дня (настройки и расписание — TIME и DAYS в data.js) -----
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
function dateOf(n) {                                   // дата n-го дня игры по старому стилю (високосный — каждый четвёртый год)
  let { day, month, year } = TIME.start; day += n;
  for (;;) {
    const len = [31, year % 4 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
    if (day <= len) break;
    day -= len; if (++month > 12) { month = 1; year++; }
  }
  return day + ' ' + MONTHS[month - 1] + ' ' + year;
}
const todayQueue = () => (DAYS[state.day] || { customers: [] }).customers;
const newToday = () => ({ revenue: 0, profit: 0, sold: {} });   // итоги текущего дня
// Текущий покупатель: только пока лавка открыта; undefined — лавка закрыта или очередь дня кончилась.
const C = () => state.phase === 'day' ? CUSTOMERS.find(c => c.id === todayQueue()[state.visit]) : undefined;
const deal = () => state.deals[C().id];
const G = () => GOODS[C().want];
const total = d => C().qty * d.price;
const profit = d => C().qty * (d.price - G().cost);
const fmt = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v && v[k] !== undefined ? v[k] : ''));
const dealVars = d => ({ rev: total(d), profit: profit(d), left: state.stock[C().want] });
const heard = id => !!state.heard[id];
const okChoice = c => (!c.need || !c.need.heard || heard(c.need.heard)) && !(c.once && c.id && state.asked[c.id]);

function learn(id) {                                   // запись о сведении появляется один раз
  if (!id || heard(id)) return;
  state.heard[id] = { n: Object.keys(state.heard).length + 1, day: state.day, visit: state.visit, ctx: [] };
  if (RUMORS[id].toast) toast(RUMORS[id].toast);
  save();
}
function learnContext(id) {                            // дополняет существующую запись, не создаёт новую
  const x = CONTEXT[id];
  if (!x || state.ctx[id] || !heard(x.to)) return;
  state.ctx[id] = true; state.heard[x.to].ctx.push(x.text); toast('Запись дополнена'); save();
}
function showNode(id) { const n = NODES[id]; learn(n.learn); learnContext(n.context); dlg = { node: n }; renderDlg(); }
function showTrade(msg) { if (msg) deal().msg = msg; dlg = { trade: true }; renderDlg(); }
function leave(nodeId) { const d = deal(); d.stage = 'after'; d.afterNode = nodeId; save(); showNode(nodeId); }
function sell() {                                      // деньги и товар меняются только здесь и один раз
  const c = C(), d = deal();
  if (d.stage === 'after' || d.stage === 'done') return;
  if (state.stock[c.want] < c.qty) return;             // подстраховка: основная проверка в verdict()
  d.stage = 'after'; d.afterNode = c.soldNode; d.sold = true;
  state.money += total(d); state.stock[c.want] -= c.qty;
  const t = state.today; t.revenue += total(d); t.profit += profit(d); t.sold[c.want] = (t.sold[c.want] || 0) + c.qty;
  save(); showNode(c.soldNode);
}
// Согласие возможно, только если одновременно: цена за единицу <= предела, сумма <= бюджета, товар есть в лавке.
function verdict(c, d) {
  if (!Number.isInteger(d.price) || d.price < 1) return 'bad';
  if (state.stock[c.want] < c.qty) return 'nostock';
  return d.price <= c.maxUnit && total(d) <= c.budget ? 'yes' : 'no';
}
function settle(d) {                                   // единый путь к сделке: и для предложения, и для принятия встречной
  const c = C(), v = verdict(c, d);
  if (v === 'bad') return showTrade('Цена должна быть целым числом, не меньше 1.');
  if (v === 'nostock') return showTrade('В лавке не хватает товара: нужно ' + c.qty + ', есть ' + state.stock[c.want] + '.');   // попытку не тратим
  if (v === 'yes') return sell();                      // успешное предложение принимается до проверки ухода
  if (++d.fails >= 3) return leave(c.leaveNode);
  d.counterUnit = Math.max(1, Math.min(c.wantUnit, c.maxUnit, Math.floor(c.budget / c.qty)));
  d.counter = d.counterUnit * c.qty;
  save(); showTrade(fmt(c.counterMsg, { counter: d.counter }));
}
const offer = () => settle(deal());
function step(k) { const d = deal(); d.price = Math.max(1, Math.min(99, d.price + k)); save(); renderDlg(); }
function tradeChoices() {
  const c = C(), d = deal(), l = [{ text: 'Предложить цену' + (profit(d) < 0 ? ' (убыток)' : ''), do: 'offer' }];
  if (d.counter) l.push({ text: 'Принять ' + d.counter, do: 'accept' });
  return l.concat(c.kind === 'story' ? c.tradeTalk.filter(okChoice) : [], [{ text: 'Отказаться', do: 'refuse' }]);
}
// ----- Режим обслуживания: Андрей занимает место за прилавком (переход между двумя заранее заданными позициями) -----
let serving = false;                                   // не сохраняется: после загрузки Андрей стоит перед прилавком, сделка продолжается
function openCustomer() {                              // показывает текущего покупателя с того места, где сделка остановилась
  const c = C();
  if (!c || !visitorReady()) { dlg = { idle: true }; return renderDlg(); }   // никого нет или покупатель ещё идёт
  const d = deal();
  if (d.stage === 'price') return showTrade();
  showNode(d.stage === 'open' ? c.openNode : d.afterNode);
}
function enterService() {
  if (dlg || notesOpen || serving || state.phase !== 'day') return;
  serving = true; player.x = SCENE.workX; player.dir = -1; player.moving = false;   // лицом к покупателю (он слева)
  openCustomer();
}
function stepAway() {                                  // сделка не продаётся и не отменяется: условия остаются в state.deals
  if (!serving) return;
  serving = false; dlg = null; player.x = SCENE.workX; player.moving = false;     // свободная позиция перед рабочим местом
  save(); renderDlg();
}
const endDlg = () => { dlg = serving ? { idle: true } : null; renderDlg(); };
function act(c) {
  if (c.id) state.asked[c.id] = true;
  if (c.promise && !state.promises[c.promise]) state.promises[c.promise] = { done: false };
  const op = c.do || '', cu = C(), d = cu && deal();
  if (!cu && ['trade', 'offer', 'accept', 'refuse', 'back', 'next'].includes(op)) { endDlg(); return; }   // покупателей больше нет
  if (op === 'next') return visitorReady() ? openCustomer() : renderDlg();
  if (op === 'leave') return stepAway();   // покупателей больше нет
  if (op === 'close') return closeShop();
  if (op === 'trade') { d.stage = 'price'; save(); return showTrade(cu.priceMsg); }   // только открывает панель цены, попытку не тратит
  if (op === 'offer') return offer();
  if (op === 'accept') { if (!d.counter) return; d.price = d.counterUnit; return settle(d); }
  if (op === 'refuse') return leave(cu.refusedNode);
  if (op === 'back') return d.stage === 'open' ? showNode(cu.openNode) : d.stage === 'price' ? showTrade() : showNode(d.afterNode);
  if (op === 'finish' && d && d.stage === 'after') { d.stage = 'done'; state.visit++; }   // следующий покупатель
  if (c.goto) { save(); return showNode(c.goto); }
  save(); endDlg();
}

// ================= СОСТОЯНИЕ И СОХРАНЕНИЕ =================
const SAVE_KEY = 'letopisi1812_save_v7';               // v7: дни и части дня (сохранения v6 не загружаются — новая игра)
const newDeal = c => ({ stage: 'open', price: GOODS[c.want].price, fails: 0, counter: 0, counterUnit: 0, msg: '', afterNode: '', sold: false });
const newState = () => ({ day: 0, phase: 'morning', today: newToday(), scene: 'shop', money: START.money, visit: 0, heard: {}, asked: {}, promises: {}, ctx: {},
  stock: Object.fromEntries(Object.keys(GOODS).map(k => [k, GOODS[k].stock])),
  deals: Object.fromEntries(CUSTOMERS.map(c => [c.id, newDeal(c)])) });
let state = load() || newState();
let dlg = null, notesOpen = false;                     // dlg: {node} или {trade:true} или null

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {                                      // старое сохранение: недостающие поля добавляются, нелепые значения — отказ
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    const num = v => typeof v === 'number' && isFinite(v);
    if (s && s.deals) CUSTOMERS.forEach(c => { if (!s.deals[c.id]) s.deals[c.id] = newDeal(c); });   // миграция: новый покупатель в очереди
    if (s && num(s.money) && Number.isInteger(s.day) && s.day >= 0 && ['morning', 'day', 'evening'].includes(s.phase) && s.today && num(s.today.revenue) &&
        Number.isInteger(s.visit) && s.visit >= 0 && s.visit <= (DAYS[s.day] || { customers: [] }).customers.length && s.heard && s.asked && s.promises && s.ctx && s.stock && s.deals &&
        Object.keys(GOODS).every(k => Number.isInteger(s.stock[k]) && s.stock[k] >= 0) &&
        CUSTOMERS.every(c => s.deals[c.id] && num(s.deals[c.id].price) && ['open', 'price', 'after', 'done'].includes(s.deals[c.id].stage))) {
      CUSTOMERS.forEach(c => {                         // миграция: у сделки появился признак «продано»
        const d = s.deals[c.id];

        if (!num(d.fails)) d.fails = 0;

// ================= КАРТЫ (экран поверх сцены; карты, места и география — в data.js, блок MAP) =================
// Каждая карта рисуется один раз при первом показе: местность, вода, дороги, валы, застройка, рощи. Случайность с постоянным зерном,
// поэтому карта всегда одинаковая. Точки мест, подписи и карточка перерисовываются при выборе места.
// Карты отличаются масштабом (view) и крупностью деталей (k); география общая (MAP.geo).
let mapOpen = false, mapId = MAP.start, mapShown = '', MV = MAP.maps[MAP.start].view;
const mapSel = {}, mapCache = {};
const nextMap = () => { const ids = Object.keys(MAP.maps); return ids[(ids.indexOf(mapId) + 1) % ids.length]; };
const mp = ([x, y]) => [MV.cx + x * MV.kmPx, MV.cy - y * MV.kmPx];           // километры → точки карты
const r1 = n => Math.round(n * 10) / 10;
function curve(pts, closed) {                         // плавная линия через точки
  const q = pts.map(mp), n = q.length, at = i => q[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];

function rng(seed) {                                  // повторяемый генератор случайных чисел

function lineDist(x, y, line) {                       // расстояние от точки до ломаной, км
  let m = Infinity;

    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));

}

function buildMap() {
  const rnd = rng(1812), o = [], M = MAP.geo, map = MAP.maps[mapId], K = map.k, art = spr['map_' + mapId];
  const x0 = -MV.cx / MV.kmPx, x1 = (MV.w - MV.cx) / MV.kmPx, y0 = -(MV.h - MV.cy) / MV.kmPx, y1 = MV.cy / MV.kmPx;   // видимая область, км

    '<feColorMatrix values="0 0 0 0 .13  0 0 0 0 .17  0 0 0 0 .07  0 0 0 1.6 -.6"/></filter>' +
    '<filter id="mGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>' +

    '<radialGradient id="mVig" cx="50%" cy="50%" r="72%"><stop offset="60%" stop-color="#0b0805" stop-opacity="0"/><stop offset="100%" stop-color="#0b0805" stop-opacity=".8"/></radialGradient></defs>');
  if (art && art.ok) o.push('<image href="' + map.art.src + '" width="' + MV.w + '" height="' + MV.h + '" preserveAspectRatio="none"/>');
  else {
    // местность: земля, тёмные пятна, поля за городом
    o.push('<rect width="' + MV.w + '" height="' + MV.h + '" fill="#5f6d3c"/><rect width="' + MV.w + '" height="' + MV.h + '" filter="url(#mTerrain)"/>');
    for (let i = 0; i < 140; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (inPoly(x, y, M.cityLine) || lineDist(x, y, M.river) < .4) continue;
      const [px, py] = mp([x, y]), w = 14 + rnd() * 30, h = 8 + rnd() * 18;
      o.push('<rect x="' + r1(px) + '" y="' + r1(py) + '" width="' + r1(w) + '" height="' + r1(h) + '" transform="rotate(' + r1(rnd() * 50 - 25) + ' ' + r1(px) + ' ' + r1(py) + ')" fill="' +
        ['#8a8a4c', '#7a8446', '#9a8a52', '#6f7c40'][i % 4] + '" opacity=".55"/>');
    }

    const hills = [[[-5.3, -4.55], [-4.3, -4.65], [-3.2, -4.6], [-2.3, -4.1]], [[-7.7, -.1], [-7.2, -.25], [-6.7, -.1]]];
    hills.forEach(h => { for (let i = 0; i < h.length - 1; i++) for (let t = 0; t < 1; t += .08) {
      const x = h[i][0] + (h[i + 1][0] - h[i][0]) * t, y = h[i][1] + (h[i + 1][1] - h[i][1]) * t, [px, py] = mp([x, y]);
      o.push('<path d="M' + r1(px) + ',' + r1(py) + 'l' + r1(rnd() * 2 - 1) + ',' + r1(7 + rnd() * 5) + '" stroke="#2e3a1c" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>');

      '<path d="' + curve(line) + '" fill="none" stroke="#4f86ad" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + curve(line) + '" fill="none" stroke="#9cc8e0" stroke-width="' + r1(w / 4) + '" stroke-linecap="round" opacity=".45" stroke-dasharray="14 10"/>';

    // застройка: сетка ячеек, вероятность дома зависит от части города
    const dens = (x, y) => {

    for (let gx = x0; gx < x1; gx += cell) for (let gy = y0; gy < y1; gy += cell) {

      '" cy="' + r1(y - 1.6 * K) + '" r="' + 2 * K + '" fill="#e2b33c"/>').join('') + '</g>');
    // деревья: рощи и сады, бульвары Белого города, одиночные деревья за городом
    const trees = [];
    M.woods.forEach(([x, y, r, n]) => { for (let i = 0; i < n; i++) {
      const a = rnd() * 6.283, d = Math.sqrt(rnd()) * r, tx = x + Math.cos(a) * d, ty = y + Math.sin(a) * d;
      if (lineDist(tx, ty, M.river) > .2) { const [px, py] = mp([tx, ty]); trees.push([px, py, 2.6 + rnd() * 2]); }
    } });

    }

    // Китай-город и Кремль: кирпичные стены с башнями, внутри соборы
    const towers = (pts, closed, step) => { const q = pts.map(mp), out = [];
      for (let i = 0; i < (closed ? q.length : q.length - 1); i++) { const a = q[i], b = q[(i + 1) % q.length], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
        for (let k = 0; k < n; k++) { const x = a[0] + (b[0] - a[0]) * k / n, y = a[1] + (b[1] - a[1]) * k / n; out.push('<rect x="' + r1(x - 2.5 * K) + '" y="' + r1(y - 2.5 * K) + '" width="' + 5 * K + '" height="' + 5 * K + '" fill="#7d2219"/>'); } }
      if (!closed) { const e = q[q.length - 1]; out.push('<rect x="' + r1(e[0] - 2.5 * K) + '" y="' + r1(e[1] - 2.5 * K) + '" width="' + 5 * K + '" height="' + 5 * K + '" fill="#7d2219"/>'); }
      return out.join(''); };
    const kq = M.kremlin.map(mp).map(p => p.map(r1).join(',')).join(' ');

    o.push('<g filter="url(#mShade)"><polygon points="' + kq + '" fill="#8a7650" stroke="#b5352b" stroke-width="' + 3.5 * K + '" stroke-linejoin="round"/>' + towers(M.kremlin, true, 9 * K));
    const [kx, ky] = mp([-.1, .05]);
    [[-6, -4], [3, -6], [-2, 4], [5, 2]].forEach(([dx, dy]) => o.push('<rect x="' + r1(kx + (dx - 2.5) * K) + '" y="' + r1(ky + (dy - 2) * K) + '" width="' + 5.5 * K + '" height="' + 5 * K + '" fill="#ece5d2"/><circle cx="' +
      r1(kx + (dx + .3) * K) + '" cy="' + r1(ky + (dy - 2.5) * K) + '" r="' + 2.3 * K + '" fill="#e9bb3f"/>'));
    o.push('<rect x="' + r1(kx - 1.5 * K) + '" y="' + r1(ky - 6 * K) + '" width="' + 3 * K + '" height="' + 9 * K + '" fill="#f4efe0"/><circle cx="' + r1(kx) + '" cy="' + r1(ky - 6.5 * K) + '" r="' + 2 * K + '" fill="#f2c24a"/></g>');

  }
  o.push('<rect width="' + MV.w + '" height="' + MV.h + '" fill="url(#mVig)"/>');
  // обозначения (слева под кнопкой), заголовок (справа вверху), роза ветров и масштаб (справа внизу)
  const kinds = Object.keys(MAP.kinds), lh = 17;

// Переход через карту: Андрей оказывается в начальной точке выбранного места, открытый разговор закрывается.
const shopOpenBlocks = () => !TIME.travelWhenOpen && state.phase === 'day';   // пока лавка открыта, уходить нельзя
function travel(scene, name) {
  if (serving || shopOpenBlocks() || (scene !== 'shop' && !SCENES[scene])) return;
  state.scene = scene; dlg = null; resetPlayer(); save();
  mapOpen = false; renderMap(); renderDlg(); toast(name);
}

// ================= ОТКРЫТИЕ И ЗАКРЫТИЕ ЛАВКИ, СМЕНА ДНЕЙ =================
let sleeping = false;                                  // идёт экран ночи: ввод и движение отключены
function openShop() { if (state.phase !== 'morning') return; state.phase = 'day'; state.visit = 0; save(); toast('Лавка открыта'); }
function closeShop() {                                 // покупатели, которые не успели, сегодня уже не придут
  if (state.phase !== 'day') return;
  state.phase = 'evening'; serving = false; player.x = SCENE.workX; player.moving = false;
  dlg = { summary: true }; save(); renderDlg();
}
function endDay() {                                    // ночь: экран перехода, затем утро следующего дня в лавке
  if (state.phase !== 'evening' || sleeping) return;
  sleeping = true; dlg = null; renderDlg();
  const n = $('night'); n.textContent = 'Ночь'; n.classList.add('on');
  setTimeout(() => {
    Object.assign(state, { day: state.day + 1, phase: 'morning', visit: 0, today: newToday(), scene: 'shop' });
    resetPlayer(); placeVisitor(); save();
    n.textContent = 'Утро, ' + dateOf(state.day) + ' года';
    setTimeout(() => { n.classList.remove('on'); sleeping = false; }, 1600);
  }, 1300);
}

// ================= ПОКУПАТЕЛИ ПРИХОДЯТ И УХОДЯТ =================
// Текущий покупатель (C) входит в дверь и идёт к прилавку; после прощания (visit вырос) уходит к двери, следующий появляется
// через arrivalDelay секунд. Движение не сохраняется: после загрузки текущий покупатель уже стоит у прилавка.
// Покупатель привязан к ключу «день / номер в очереди / открыта ли лавка»: ключ сменился — прежний уходит (в том числе при закрытии лавки).
const vkey = () => state.day + '/' + state.visit + '/' + state.phase;
const visitor = { key: '', cust: null, x: 0, phase: 'none', wait: 0 }; // phase: in — идёт к прилавку, here — стоит, none — никого
let leaving = [];                                      // ушедшие покупатели, которые ещё идут к двери: { x, color }
function placeVisitor() { Object.assign(visitor, { key: vkey(), cust: C() || null, x: SCENE.customerX, phase: C() ? 'here' : 'none', wait: 0 }); leaving = []; }
const visitorReady = () => visitor.key === vkey() && visitor.phase === 'here';
function updateVisitors(dt) {
  const v = SCENE.customerSpeed * dt;
  if (visitor.key !== vkey()) {                        // очередь сдвинулась или лавка закрылась: прежний уходит, следующий скоро войдёт
    if (visitor.cust && visitor.phase !== 'none' && visitor.wait <= 0) leaving.push({ x: visitor.x, color: visitor.cust.color });
    Object.assign(visitor, { key: vkey(), cust: C() || null, x: SCENE.doorX, phase: C() ? 'in' : 'none', wait: SCENE.arrivalDelay });
  }
  leaving.forEach(l => { l.x += v; }); leaving = leaving.filter(l => l.x < SCENE.doorX);
  if (visitor.phase !== 'in') return;
  if (visitor.wait > 0) { visitor.wait -= dt; return; }
  visitor.x -= v;
  if (visitor.x <= SCENE.customerX) {
    visitor.x = SCENE.customerX; visitor.phase = 'here';
    if (dlg && dlg.idle) renderDlg();                  // Андрей за прилавком ждёт: появляется «Обслужить следующего»
  }
}
function drawVisitors() {                              // слой 6: покупатели перед прилавком
  const sw = x => Math.round(Math.sin(x / 4) * 4);
  leaving.forEach(l => person(l.x, LANE, l.color, sw(l.x), 1));
  if (visitor.cust && visitor.key === vkey() && visitor.wait <= 0 && visitor.phase !== 'none')
    person(visitor.x, LANE, visitor.cust.color, visitor.phase === 'in' ? sw(visitor.x) : 0, visitor.phase === 'in' ? -1 : 1);
}

// ================= ОБНОВЛЕНИЕ =================
function update(dt) {
  updateVisitors(dt);
  player.moving = false;
  if (dlg || notesOpen || serving || mapOpen || sleeping) return;  // во время диалога, заметок, обслуживания и карты движение заблокировано
  const dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const f = floorX(), nx = Math.min(Math.max(player.x + dx * player.speed * dt, f.l), f.r);
  const d = Math.abs(nx - player.x);
  player.x = nx;
  if (d > 0) { player.moving = true; player.dist += d; }
  if (dx !== 0) player.dir = dx;                       // взгляд меняется мгновенно (зеркалирование)
}

// ================= РИСОВАНИЕ =================
const rect = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
function shelf(x, y, n) {
  const cols = ['#a33', '#c93', '#5a8', '#ca8'];
  for (let r = 0; r < 3; r++) {
    rect('#2a1a0e', x, y + 9 + r * 20, n * 13 + 5, 2);
    for (let i = 0; i < n; i++) rect(cols[(i + r) % 4], x + 4 + i * 13, y + r * 20, 5, 9);
  }
}
// Заглушка-человечек (ростом ~66 px, как будущие спрайты). Нужна для покупателей и пока нет картинок Андрея.
function person(x, y, color, swing, dir) {
  const k = SCENE.charScale, R = (c, dx, dy, w, h) => rect(c, Math.round(x + dx * k), Math.round(y + dy * k), Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k)));
  R('#1d1510', -8 + swing, -22, 6, 22);
  R('#1d1510', 2 - swing, -22, 6, 22);
  R(color, -11, -50, 22, 28);
  R('#e0b890', -7, -66, 14, 16);
  R('#2a1a0e', dir > 0 ? 2 : -7, -60, 5, 3);
  R('#d8d0b0', -2 - swing, -48, 5, 20);
}
// Андрей: кадр покоя нужен всегда (иначе заглушка целиком). Файла ходьбы пока нет — при движении показывается тот же статичный

function drawAndrey(x, y, dir, moving) {
  const A = ANDREY, cycle = (player.dist / A.cycleDistance) % 1;
  if (!spr.idle.ok) { person(x, y, '#6b8a3a', moving ? Math.round(Math.sin(cycle * 2 * Math.PI) * 5) : 0, dir); return; }
  const useWalk = moving && spr.walk.ok, img = useWalk ? spr.walk : spr.idle;
  const f = useWalk ? Math.floor(cycle * A.walk.frames) : 0;
  ctx.save();
  ctx.translate(Math.round(x), 0);
  if (dir < 0) ctx.scale(-1, 1);                           // влево — зеркало (вправо рисуем как есть)
  const k = SCENE.charScale;                               // опора (48, 76) остаётся на месте, увеличивается всё вокруг неё
  ctx.drawImage(img, f * A.cellW, 0, A.cellW, A.cellH, -Math.round(A.anchorX * k), Math.round(y) - Math.round(A.floorY * k), Math.round(A.cellW * k), Math.round(A.cellH * k));
  ctx.restore();
}

  else rect('#3b2616', SCENE.counter.l, 100, SCENE.counter.r - SCENE.counter.l, 36);
}
function drawFront() {                                 // слой 8
  if (spr.front.ok) ctx.drawImage(spr.front, 0, 0);
  else if (!spr.bg.ok) { rect('#17100a', 0, 159, 40, 21); rect('#17100a', SCENE.worldW - 47, 155, 47, 25); }   // заглушка только вместе с заглушкой фона
}
// Другое место (не лавка): фон или заглушка, персонажи, Андрей.
function drawPlace() {
  const c = scn(), bg = spr['bg_' + state.scene];
  ctx.save(); ctx.translate(-cameraX(), 0);
  if (bg && bg.ok) ctx.drawImage(bg, 0, 0);
  else {                                               // заглушка: стена, пол, мешки у стены
    rect(c.wall, 0, 0, c.worldW, c.lane - 28); rect(c.floor, 0, c.lane - 28, c.worldW, H - c.lane + 28);
    for (let x = 12; x < c.worldW - 20; x += 26) { rect('#2a1f14', x - 1, c.lane - 50, 22, 23); rect('#cbb88e', x, c.lane - 49, 20, 21); rect('#b3a077', x + 3, c.lane - 49, 14, 4); }
  }
  (c.npcs || []).forEach(n => person(n.x, c.lane, n.color, 0, -1));
  drawAndrey(player.x, player.y, player.dir, player.moving);
  ctx.restore();
}
function draw() {
  const cam = cameraX();
  ctx.clearRect(0, 0, W, H);
  if (!inShop()) { drawPlace(); drawHud(); return; }
  if (!spr.bg.ok) { rect('#3a2819', 0, 0, W, 120); rect('#7a5836', 0, 120, W, H - 120); }   // заглушка: стена и пол
  ctx.save(); ctx.translate(-cam, 0);                  // дальше всё в координатах мира
  drawBackdrop();
  drawStock();
  person(SCENE.motherX, LANE, MOTHER.color, 0, 1);
  if (serving) drawAndrey(SCENE.workX, SCENE.serviceY, player.dir, false);
  drawCounterFront();
  drawVisitors();
  if (!serving) drawAndrey(player.x, player.y, player.dir, player.moving);
  drawFront();
  ctx.restore();
  drawHud();
}
function drawHud() {
  const t = TIME.tint[state.phase]; if (t) rect(t, 0, 0, W, H);   // свет части дня поверх сцены
  $('hud').innerHTML = dateOf(state.day) + ', ' + TIME.phases[state.phase] + '<br>Монет: ' + state.money;
  $('dbg').textContent = problems.length ? 'Временная графика' : '';
  const h = $('hint');
  const msg = serving || sleeping ? '' : nearMom() || nearNpc() ? 'E — Поговорить' :
    nearWork() ? { morning: 'E — Открыть лавку', day: 'E — Встать за прилавок', evening: 'E — Закончить день' }[state.phase] :
    (inShop() && state.phase === 'day' && !C() && !dlg) ? 'Покупателей сегодня больше нет. Закрыть лавку можно за прилавком.' : '';
  h.style.display = msg ? 'block' : 'none'; h.textContent = msg;
}

// ================= ГЛАВНЫЙ ЦИКЛ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
placeVisitor(); renderDlg(); renderNotes(); requestAnimationFrame(loop);
</script>
