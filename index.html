<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Летописи: 1812</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0805; overflow: hidden; font-family: Georgia, serif; }
  /* Сцена всегда в целое число раз больше 480×270 (переменная --s): пиксели остаются чёткими.
     Размеры интерфейса заданы в единицах --u = 1,5 × --s (единица прежней сетки 320×180), поэтому на экране интерфейс прежний. */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: calc(var(--s) * 480px); height: calc(var(--s) * 270px); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud, #hint, #newgame, #dbg, #back { position: absolute; color: #f0e2c0; font-size: calc(var(--u) * 5px); text-shadow: 1px 1px #000; }
  #hud { right: calc(var(--u) * 4px); top: calc(var(--u) * 3px); text-align: right; }
  #night { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: #05070d; color: #f0e2c0;
           font-size: calc(var(--u) * 9px); opacity: 0; pointer-events: none; transition: opacity .6s; }
  #night.on { opacity: 1; pointer-events: auto; }
  #night div { max-width: 70%; text-align: center; line-height: 1.4; }
  #night b { display: block; color: #e8c36a; font-size: calc(var(--u) * 11px); margin-bottom: calc(var(--u) * 4px); }
  #night p { font-size: calc(var(--u) * 7px); margin: 0 0 calc(var(--u) * 4px); }
  #night i { opacity: .8; } #night small { display: block; opacity: .5; font-size: calc(var(--u) * 5px); margin-top: calc(var(--u) * 6px); }
  #hint { left: 0; right: 0; top: calc(var(--u) * 13px); text-align: center; display: none; }
  #newgame { left: calc(var(--u) * 4px); top: calc(var(--u) * 3px); background: none; border: 1px solid #f0e2c066;
             font-family: inherit; opacity: .6; cursor: pointer; }
  #dbg { left: calc(var(--u) * 4px); top: calc(var(--u) * 15px); color: #c9b98a; opacity: .75; }
  #back { display: none; left: calc(var(--u) * 4px); top: calc(var(--u) * 3px); font-family: inherit; cursor: pointer; text-shadow: none;
          background: rgba(20,12,6,.92); border: calc(var(--u) * 1px) solid #8c7647; padding: calc(var(--u) * 1.5px) calc(var(--u) * 5px); }
  body.serving #newgame, body.serving #notesbtn { display: none; }
  /* Сцена-ролик: подпись внизу (над чёрной полосой) и историческая справка карточкой на «бумаге» */
  body.cine #stage > *:not(canvas):not(#cine) { display: none !important; }
  #cine { position: absolute; inset: 0; z-index: 9; display: none; pointer-events: auto; cursor: pointer; }
  #cine.on { display: block; }
  #cine .cap { position: absolute; left: 12%; right: 12%; bottom: calc(var(--u) * 17px); text-align: center; color: #efdcba;
               font-size: calc(var(--u) * 6.5px); line-height: 1.4; text-shadow: 0 0 calc(var(--u) * 2px) #000, 1px 1px #000; }
  #cine .fact { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 62%; box-sizing: border-box;
                background: #efdcba; color: #261b15; border: calc(var(--u) * 1px) solid #4c1c0b; box-shadow: calc(var(--u) * 2px) calc(var(--u) * 2px) 0 #0a0b13;
                padding: calc(var(--u) * 5px) calc(var(--u) * 8px); font-size: calc(var(--u) * 5.5px); line-height: 1.4; }
  #cine .fact b { display: block; color: #911104; font-size: calc(var(--u) * 7px); margin-bottom: calc(var(--u) * 2px); letter-spacing: .04em; text-transform: uppercase; }
  #cine .fact p { margin: 0; }
  #cine small { position: absolute; right: calc(var(--u) * 4px); bottom: calc(var(--u) * 4px); color: #efdcba; opacity: .45; font-size: calc(var(--u) * 4.5px); }
  #cine .cap, #cine .fact { opacity: 0; }
  #cine.show .cap, #cine.show .fact { animation: cinein 1.2s .5s forwards; }
  @keyframes cinein { to { opacity: 1; } }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--u) * 24px); display: none; z-index: 5;
           background: rgba(20,12,6,.92); border: 2px solid #e8c36a; color: #f0e2c0; padding: calc(var(--u) * 2px) calc(var(--u) * 6px);
           font-size: calc(var(--u) * 6px); }
  #notes { position: absolute; inset: calc(var(--u) * 10px) calc(var(--u) * 30px); display: none; overflow: auto; box-sizing: border-box; z-index: 4;
           background: rgba(20,12,6,.96); border: 2px solid #c9a96a; color: #f0e2c0; padding: calc(var(--u) * 4px) calc(var(--u) * 8px);
           font-size: calc(var(--u) * 6px); line-height: 1.35; }
  #notes h3 { margin: 0 0 calc(var(--u) * 3px); } #notes p { margin: 0 0 calc(var(--u) * 3px); }
  #notesbtn { position: absolute; left: calc(var(--u) * 52px); top: calc(var(--u) * 3px); background: none; border: 1px solid #f0e2c066;
              color: #f0e2c0; font-family: inherit; font-size: calc(var(--u) * 5px); opacity: .6; cursor: pointer; }
  /* Режим обслуживания (по макету): портрет слева внизу, реплика внизу, панель справа. Всё размещено в единицах --u (доли прежней сетки 320×180). */
  #dlg { position: absolute; inset: 0; display: none; pointer-events: none; }
  #dlg > * { pointer-events: auto; }
  #portrait { position: absolute; left: 0; bottom: 0; width: calc(var(--u) * 120px); height: calc(var(--u) * 136px); display: none; pointer-events: none; }
  #portrait img { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: contain; object-position: left bottom; }
  #portrait .ph { position: absolute; left: 0; bottom: 0; width: 62%; height: 80%; opacity: .8; display: flex; align-items: center; justify-content: center;
                  font-size: calc(var(--u) * 40px); color: #f0e2c0aa; border: calc(var(--u) * 1px) solid #8c7647; border-bottom: 0; box-sizing: border-box; }
  #col { position: absolute; left: calc(var(--u) * 118px); right: calc(var(--u) * 4px); bottom: calc(var(--u) * 4px); display: flex; flex-direction: column; gap: calc(var(--u) * 2px); }
  body.paneled #col { right: calc(var(--u) * 92px); }
  #box { background: rgba(20,12,6,.94); border: calc(var(--u) * 1px) solid #8c7647; color: #f0e2c0; white-space: pre-line;
         padding: calc(var(--u) * 3px) calc(var(--u) * 6px); min-height: calc(var(--u) * 22px); font-size: calc(var(--u) * 6px); line-height: 1.35; }
  #who { color: #e8c36a; font-weight: bold; font-size: calc(var(--u) * 7px); }
  #who:empty { display: none; }
  #choices { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 2px); }
  #choices button, #pact button { font: inherit; font-size: calc(var(--u) * 5.5px); padding: calc(var(--u) * 2px) calc(var(--u) * 3px); cursor: pointer;
                  background: rgba(20,12,6,.94); color: #f0e2c0; border: calc(var(--u) * 1px) solid #8c7647; flex: 1 1 auto; }
  #choices button:hover, #pact button:hover, #back:hover { border-color: #e8c36a; }
  #choices button:disabled, #pact button:disabled { opacity: .4; cursor: not-allowed; }
  #pact button:first-child.main { background: #c9a96a; color: #1a1008; font-weight: bold; }
  #panel { position: absolute; right: calc(var(--u) * 4px); top: calc(var(--u) * 17px); width: calc(var(--u) * 84px); box-sizing: border-box; display: none;
           flex-direction: column; background: rgba(20,12,6,.94); border: calc(var(--u) * 1px) solid #8c7647; color: #f0e2c0;
           padding: calc(var(--u) * 2.5px); font-size: calc(var(--u) * 5.5px); line-height: 1.25; }
  #panel.full { bottom: calc(var(--u) * 3px); overflow-y: auto; }
  #panel i { opacity: .7; font-size: calc(var(--u) * 4.5px); line-height: 1.15; display: block; }
  #panel .head { display: flex; gap: calc(var(--u) * 3px); align-items: center; margin-bottom: calc(var(--u) * 2px); }
  #panel .gi { flex: none; width: calc(var(--u) * 20px); height: calc(var(--u) * 20px); border: calc(var(--u) * 1px) solid #8c7647; box-sizing: border-box; }
  #panel .gi img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel .row { display: flex; justify-content: space-between; align-items: center; }
  #panel .step { display: flex; align-items: center; justify-content: space-between; margin: calc(var(--u) * 1px) 0; }
  #panel .step button { font: inherit; font-size: calc(var(--u) * 6px); width: calc(var(--u) * 14px); cursor: pointer; background: rgba(20,12,6,.94); color: #f0e2c0; border: calc(var(--u) * 1px) solid #8c7647; }
  #panel .step b { font-size: calc(var(--u) * 8px); }
  #pact { margin-top: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 1.5px); padding-top: calc(var(--u) * 2px); }
  #pact button { padding: calc(var(--u) * 1.5px) calc(var(--u) * 3px); }
  /* Карта: экран поверх сцены. Сама карта — SVG в рамке 1000×560 (растягивается на всю сцену), карточка места — HTML */
  #mapbtn { position: absolute; left: calc(var(--u) * 89px); top: calc(var(--u) * 3px); background: none; border: 1px solid #f0e2c066;
            color: #f0e2c0; font-family: inherit; font-size: calc(var(--u) * 5px); opacity: .6; cursor: pointer; }
  body.serving #mapbtn, body.serving #screenbtn, body.serving #soundbtn { display: none; }
  #soundbtn { position: absolute; left: calc(var(--u) * 166px); top: calc(var(--u) * 3px); background: none; border: 1px solid #f0e2c066;
              color: #f0e2c0; font-family: inherit; font-size: calc(var(--u) * 5px); opacity: .6; cursor: pointer; }
  #screenbtn { position: absolute; left: calc(var(--u) * 122px); top: calc(var(--u) * 3px); background: none; border: 1px solid #f0e2c066;
               color: #f0e2c0; font-family: inherit; font-size: calc(var(--u) * 5px); opacity: .6; cursor: pointer; }
  #map { position: absolute; inset: 0; display: none; z-index: 6; background: #0b0805; overflow: hidden; }
  #map svg { width: 100%; height: 100%; display: block; font-family: Georgia, serif; }
  #map .loc { cursor: pointer; }
  #map .loc:hover .dot { stroke: #fff; }
  #mapclose { position: absolute; left: calc(var(--u) * 4px); top: calc(var(--u) * 3px); font-family: inherit; cursor: pointer; color: #f0e2c0;
              font-size: calc(var(--u) * 5px); background: rgba(20,12,6,.92); border: calc(var(--u) * 1px) solid #8c7647; padding: calc(var(--u) * 1.5px) calc(var(--u) * 5px); }
  #mapswitch { position: absolute; left: calc(var(--u) * 60px); top: calc(var(--u) * 3px); font-family: inherit; cursor: pointer; color: #f0e2c0;
               font-size: calc(var(--u) * 5px); background: rgba(20,12,6,.92); border: calc(var(--u) * 1px) solid #8c7647; padding: calc(var(--u) * 1.5px) calc(var(--u) * 5px); }
  #mapclose:hover, #mapswitch:hover { border-color: #e8c36a; }
  #mapcard { position: absolute; left: calc(var(--u) * 4px); bottom: calc(var(--u) * 4px); width: calc(var(--u) * 92px); box-sizing: border-box;
             background: rgba(20,12,6,.94); border: calc(var(--u) * 1px) solid #8c7647; color: #f0e2c0; padding: calc(var(--u) * 3px) calc(var(--u) * 4px);
             font-size: calc(var(--u) * 5.5px); line-height: 1.3; }
  #mapcard b { color: #e8c36a; font-size: calc(var(--u) * 6.5px); display: block; }
  #mapcard i { opacity: .7; font-size: calc(var(--u) * 4.5px); display: block; margin-bottom: calc(var(--u) * 1.5px); }
  #mapcard p { margin: calc(var(--u) * 1.5px) 0 0; }
  #mapgo { font: inherit; cursor: pointer; background: #c9a96a; color: #1a1008; font-weight: bold; border: calc(var(--u) * 1px) solid #8c7647;
           padding: calc(var(--u) * 1.5px) calc(var(--u) * 5px); width: 100%; }
  #mapgo:hover { border-color: #e8c36a; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="newgame">Новая игра</button><button id="notesbtn">Заметки (N)</button><button id="mapbtn">Карта (M)</button><button id="screenbtn"></button><button id="soundbtn"></button><button id="back">← Отойти от прилавка</button>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="dbg"></div>
  <div id="dlg"><div id="portrait"></div><div id="col"><div id="box"><div id="who"></div><div id="text"></div></div><div id="choices"></div></div><div id="panel"></div></div>
  <div id="toast"></div><div id="notes"></div><div id="night"></div><div id="cine"></div>
  <div id="map"><svg viewBox="0 0 1000 560" preserveAspectRatio="none"><g id="mapbase"></g><g id="mapmarks"></g></svg><button id="mapclose">← Вернуться (M)</button><button id="mapswitch"></button><div id="mapcard"></div></div>
</div>
<script src="data.js"></script>
<script>
// ================= ПРОВЕРКА data.js (чтобы вместо чёрного экрана было понятное сообщение) =================
if (typeof DATA_VERSION === 'undefined' || DATA_VERSION !== 21) {
  const why = typeof DATA_VERSION === 'undefined'
    ? 'Рядом с index.html не найден data.js или он старой версии.'
    : 'Файл data.js от другой версии игры.';
  document.getElementById('stage').style.display = 'none';
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;color:#f0e2c0;font:20px/1.5 Georgia,serif;text-align:center;';
  box.innerHTML = '<div style="max-width:640px"><b>Игра не может запуститься.</b><br>' + why +
    '<br><br>Что сделать: скачайте актуальные <b>index.html</b> и <b>data.js</b> вместе (лучше всего через Code → Download ZIP на GitHub), положите в одну папку и удалите копии вроде «data (1).js». Затем обновите страницу (F5).</div>';
  document.body.appendChild(box);
  throw new Error('data.js не найден или не той версии');
}

// ================= НАСТРОЙКИ ЭКРАНА =================
const W = 480, H = 270;                                // сетка пикселей экрана (с 21.10.2026; раньше 320×180)
// Текущая сцена: лавка (SCENE в data.js) или другое место из SCENES. Ширина мира, линия пола и границы ходьбы берутся из неё.
const scn = () => state.scene === 'shop' ? SCENE : SCENES[state.scene];
const inShop = () => state.scene === 'shop';
const LANE = SCENE.lane;                               // линия пола лавки
const floorX = () => { const c = scn(); return { l: c.walkMin, r: c.walkMax !== undefined ? c.walkMax : c.worldW - c.walkMin }; };   // без walkMax — симметрично
const speakers = () => [...CUSTOMERS, MOTHER, ...Object.values(SCENES).flatMap(c => c.npcs || [])];

// ================= РАЗГОВОРЫ И ТОРГОВЛЯ (логика; реплики, числа и условия — в data.js) =================
// ----- Дни и части дня (настройки и расписание — TIME и DAYS в data.js) -----
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const dateOf = n => { const [d, m] = DAYS[n].date; return d + ' ' + MONTHS[m - 1] + ' ' + TIME.year; };   // дата n-го играбельного дня (старый стиль)
const todayQueue = () => (DAYS[state.day] || { visits: [] }).visits;
// Приход = человек (CUSTOMERS) + что ему нужно в этот раз (VISITS). id — человек (портрет, имя), visit — приход (сделка).
const VIS = Object.fromEntries(Object.keys(VISITS).map(v => [v, Object.assign({}, CUSTOMERS.find(p => p.id === VISITS[v].who), VISITS[v], { id: VISITS[v].who, visit: v })]));
Object.keys(VIS).forEach(v => { if (!CUSTOMERS.some(p => p.id === VISITS[v].who)) console.error('[данные] приход ' + v + ': нет покупателя ' + VISITS[v].who); });
DAYS.forEach((d, i) => d.visits.forEach(v => { if (!VIS[v]) console.error('[данные] день ' + (i + 1) + ': нет прихода ' + v); }));
Object.keys(SUPPLY).forEach(s => { if (!speakers().some(p => p.id === s)) console.error('[данные] SUPPLY: нет персонажа ' + s);
  Object.keys(SUPPLY[s].goods).forEach(k => { if (!GOODS[k]) console.error('[данные] SUPPLY.' + s + ': нет товара ' + k); }); });
const newToday = () => ({ revenue: 0, profit: 0, sold: {} });   // итоги текущего дня
// Текущий покупатель: только пока лавка открыта; undefined — лавка закрыта или очередь дня кончилась.
const C = () => state.phase === 'day' ? VIS[todayQueue()[state.visit]] : undefined;
const deal = () => state.deals[C().visit];
const G = () => GOODS[C().want];
const total = d => C().qty * d.price;
const profit = d => C().qty * (d.price - G().cost);
const fmt = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v && v[k] !== undefined ? v[k] : ''));
const dealVars = d => ({ rev: total(d), profit: profit(d), left: state.stock[C().want] });
const heard = id => !!state.heard[id];
// Условие need: heard — слух известен; ctx — запись уже дополнена (CONTEXT); sold — в указанном приходе была продажа;
// notSold — продажи не было (или приход ещё не был).
const okNeed = n => !n || ((!n.heard || heard(n.heard)) && (!n.ctx || !!state.ctx[n.ctx]) && (!n.sold || !!(state.deals[n.sold] || {}).sold) && (!n.notSold || !(state.deals[n.notSold] || {}).sold));
const okChoice = c => okNeed(c.need) && !(c.once && c.id && state.asked[c.id]);
const pickNode = x => typeof x === 'string' ? x : x.find(o => okNeed(o.need)).node;   // первая реплика: строка или список вариантов

function learn(id) {                                   // запись о сведении появляется один раз
  if (!id || heard(id)) return;
  state.heard[id] = { n: Object.keys(state.heard).length + 1, day: state.day, visit: state.visit, ctx: [] };
  if (RUMORS[id].toast) toast(RUMORS[id].toast);
  save();
}
function learnContext(id) {                            // дополняет существующую запись, не создаёт новую
  const x = CONTEXT[id];
  if (!x || state.ctx[id] || !heard(x.to)) return;
  state.ctx[id] = true; state.heard[x.to].ctx.push(x.text); toast('Запись дополнена'); save();
}
function showNode(id) { const n = NODES[id]; learn(n.learn); learnContext(n.context); dlg = { node: n }; renderDlg(); }
function showTrade(msg) { if (msg) deal().msg = msg; dlg = { trade: true }; renderDlg(); }
function leave(nodeId) { const d = deal(); d.stage = 'after'; d.afterNode = nodeId; save(); showNode(nodeId); }
function sell() {                                      // деньги и товар меняются только здесь и один раз
  const c = C(), d = deal();
  if (d.stage === 'after' || d.stage === 'done') return;
  if (state.stock[c.want] < c.qty) return;             // подстраховка: основная проверка в verdict()
  d.stage = 'after'; d.afterNode = c.soldNode; d.sold = true;
  state.money += total(d); state.stock[c.want] -= c.qty; sfx.coins(); giveStart = performance.now() / 1000;
  const t = state.today; t.revenue += total(d); t.profit += profit(d); t.sold[c.want] = (t.sold[c.want] || 0) + c.qty;
  save(); showNode(c.soldNode);
}
// Согласие возможно, только если одновременно: цена за единицу <= предела, сумма <= бюджета, товар есть в лавке.
function verdict(c, d) {
  if (!Number.isInteger(d.price) || d.price < 1) return 'bad';
  if (state.stock[c.want] < c.qty) return 'nostock';
  return d.price <= c.maxUnit && total(d) <= c.budget ? 'yes' : 'no';
}
function settle(d) {                                   // единый путь к сделке: и для предложения, и для принятия встречной
  const c = C(), v = verdict(c, d);
  if (v === 'bad') return showTrade('Цена должна быть целым числом, не меньше 1.');
  if (v === 'nostock') return showTrade('В лавке не хватает товара: нужно ' + c.qty + ', есть ' + state.stock[c.want] + '.');   // попытку не тратим
  if (v === 'yes') return sell();                      // успешное предложение принимается до проверки ухода
  if (++d.fails >= 3) return leave(c.leaveNode);
  d.counterUnit = Math.max(1, Math.min(c.wantUnit, c.maxUnit, Math.floor(c.budget / c.qty)));
  d.counter = d.counterUnit * c.qty;
  save(); showTrade(fmt(c.counterMsg, { counter: d.counter }));
}
const offer = () => settle(deal());
function step(k) { const d = deal(); d.price = Math.max(1, Math.min(99, d.price + k)); save(); renderDlg(); }
function tradeChoices() {
  const c = C(), d = deal(), l = [{ text: 'Предложить цену' + (profit(d) < 0 ? ' (убыток)' : ''), do: 'offer' }];
  if (d.counter) l.push({ text: 'Принять ' + d.counter, do: 'accept' });
  return l.concat(c.kind === 'story' ? c.tradeTalk.filter(okChoice) : [], [{ text: 'Отказаться', do: 'refuse' }]);
}
// ----- Закупка у оптовика (SUPPLY в data.js): платится сразу, товар привозят в лавку на следующее утро -----
// state.orders — оплаченные заказы, которые привезут утром: { seller: { товар: количество } }. Черновик заказа живёт только в dlg.
const lastDay = () => state.day + 1 >= DAYS.length;    // в последний день текущей версии утра не будет — заказ не принимается
const npcName = id => speakers().find(p => p.id === id).name;
const ordered = (s, k) => (state.orders[s] || {})[k] || 0;
const orderSum = () => Object.keys(dlg.qty).reduce((n, k) => n + dlg.qty[k] * SUPPLY[dlg.order].goods[k].cost, 0);
const orderText = o => Object.keys(o).map(k => GOODS[k].name + ' × ' + o[k]).join(', ');
function showOrder(seller, msg) {
  const s = SUPPLY[seller];
  dlg = { order: seller, qty: dlg && dlg.order === seller ? dlg.qty : {}, msg: msg || (lastDay() ? s.lastDayMsg : s.askMsg) }; renderDlg();
}
function orderStep(k, n) {
  const s = SUPPLY[dlg.order], was = dlg.qty[k] || 0;
  if (lastDay()) return;
  dlg.qty[k] = Math.max(0, Math.min(s.goods[k].max - ordered(dlg.order, k), was + n));
  if (orderSum() > state.money) { dlg.qty[k] = was; return showOrder(dlg.order, s.noMoneyMsg); }
  showOrder(dlg.order, n < 0 ? s.askMsg : dlg.msg === s.noMoneyMsg ? s.askMsg : dlg.msg);
}
function placeOrder() {                                // деньги списываются здесь и один раз; товар приходит в deliver()
  const s = dlg.order, sum = orderSum();
  if (!sum || sum > state.money || lastDay()) return;
  const o = state.orders[s] = state.orders[s] || {};
  Object.keys(dlg.qty).forEach(k => { if (dlg.qty[k]) o[k] = (o[k] || 0) + dlg.qty[k]; });
  state.money -= sum; save(); sfx.coins();
  toast('Заказано: ' + orderText(o) + '. Привезут завтра утром');
  showNode(SUPPLY[s].doneNode);
}
function deliver() {                                   // утро: всё заказанное накануне уже в лавке; возвращает строку для сообщения
  const got = Object.keys(state.orders).filter(s => Object.keys(state.orders[s]).length)
    .map(s => { Object.keys(state.orders[s]).forEach(k => { state.stock[k] += state.orders[s][k]; }); return npcName(s) + ' привёз: ' + orderText(state.orders[s]); });
  state.orders = {};
  return got.join('; ');
}

// ----- Режим обслуживания: Андрей занимает место за прилавком (переход между двумя заранее заданными позициями) -----
let serving = false;                                   // не сохраняется: после загрузки Андрей стоит перед прилавком, сделка продолжается
function openCustomer() {                              // показывает текущего покупателя с того места, где сделка остановилась
  const c = C();
  if (!c || !visitorReady()) { dlg = { idle: true }; return renderDlg(); }   // никого нет или покупатель ещё идёт
  const d = deal();
  if (d.stage === 'price') return showTrade();
  showNode(d.stage === 'open' ? pickNode(c.openNode) : d.afterNode);
}
function enterService() {
  if (dlg || notesOpen || serving || state.phase !== 'day') return;
  serving = true; player.x = SCENE.workX; player.dir = -1; player.moving = false;   // лицом к покупателю (он слева)
  openCustomer();
}
function stepAway() {                                  // сделка не продаётся и не отменяется: условия остаются в state.deals
  if (!serving) return;
  serving = false; dlg = null; player.x = SCENE.workX; player.moving = false;     // свободная позиция перед рабочим местом
  save(); renderDlg();
}
const endDlg = () => { dlg = serving ? { idle: true } : null; renderDlg(); };
function act(c) {
  if (c.id) state.asked[c.id] = true;
  if (c.promise && !state.promises[c.promise]) state.promises[c.promise] = { done: false };
  if (c.keep && state.promises[c.keep] && !state.promises[c.keep].done) { state.promises[c.keep].done = true; toast('Обещание выполнено'); }
  const op = c.do || '', cu = C(), d = cu && deal();
  if (op === 'order') return showOrder(c.seller);
  if (op === 'buy') return placeOrder();
  if (!cu && ['trade', 'offer', 'accept', 'refuse', 'back', 'next'].includes(op)) { endDlg(); return; }   // покупателей больше нет
  if (op === 'next') return visitorReady() ? openCustomer() : renderDlg();
  if (op === 'leave') return stepAway();   // покупателей больше нет
  if (op === 'close') return closeShop();
  if (op === 'trade') { d.stage = 'price'; save(); return showTrade(cu.priceMsg); }   // только открывает панель цены, попытку не тратит
  if (op === 'offer') return offer();
  if (op === 'accept') { if (!d.counter) return; d.price = d.counterUnit; return settle(d); }
  if (op === 'refuse') return leave(cu.refusedNode);
  if (op === 'back') return d.stage === 'open' ? showNode(pickNode(cu.openNode)) : d.stage === 'price' ? showTrade() : showNode(d.afterNode);
  if (op === 'finish' && d && d.stage === 'after') { d.stage = 'done'; state.visit++; }   // следующий покупатель
  if (c.goto) { save(); return showNode(c.goto); }
  save(); endDlg();
}

// ================= СОСТОЯНИЕ И СОХРАНЕНИЕ =================
const SAVE_KEY = 'letopisi1812_save_v7';               // v7: дни и части дня (сохранения v6 не загружаются — новая игра)
const newDeal = c => ({ stage: 'open', price: GOODS[c.want].price, fails: 0, counter: 0, counterUnit: 0, msg: '', afterNode: '', sold: false });
const newState = () => ({ day: 0, phase: 'morning', today: newToday(), scene: 'shop', money: START.money, visit: 0, heard: {}, asked: {}, promises: {}, ctx: {}, orders: {},
  stock: Object.fromEntries(Object.keys(GOODS).map(k => [k, GOODS[k].stock])),
  deals: Object.fromEntries(Object.keys(VIS).map(v => [v, newDeal(VIS[v])])) });   // сделка у каждого прихода своя
const loaded = load();
let state = loaded || newState();
let dlg = null, notesOpen = false;                     // dlg: {node} или {trade:true} или null

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {                                      // старое сохранение: недостающие поля добавляются, нелепые значения — отказ
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    const num = v => typeof v === 'number' && isFinite(v);
    if (s && s.deals) Object.keys(VIS).forEach(v => {  // миграция: раньше сделка хранилась по человеку (pavel), теперь по приходу (pavel_1)
      const who = VISITS[v].who;
      if (!s.deals[v]) s.deals[v] = v === who + '_1' && s.deals[who] ? s.deals[who] : newDeal(VIS[v]);
    });
    if (s && num(s.money) && Number.isInteger(s.day) && s.day >= 0 && ['morning', 'day', 'evening'].includes(s.phase) && s.today && num(s.today.revenue) &&
        s.day < DAYS.length && Number.isInteger(s.visit) && s.visit >= 0 && s.visit <= (DAYS[s.day] || { visits: [] }).visits.length && s.heard && s.asked && s.promises && s.ctx && s.stock && s.deals &&
        Object.keys(GOODS).every(k => Number.isInteger(s.stock[k]) && s.stock[k] >= 0) &&
        Object.keys(VIS).every(v => num(s.deals[v].price) && ['open', 'price', 'after', 'done'].includes(s.deals[v].stage))) {
      Object.values(VIS).forEach(c => {                // миграция: у сделки появился признак «продано»
        const d = s.deals[c.visit];
        if (typeof d.sold !== 'boolean') d.sold = d.stage !== 'open' && d.stage !== 'price' && d.afterNode === c.soldNode;
        if (!num(d.fails)) d.fails = 0;
        if (typeof d.msg !== 'string') d.msg = '';
      });
      if (s.scene !== 'shop' && !SCENES[s.scene]) s.scene = 'shop';   // миграция: раньше сцена была одна
      // миграция (DATA_VERSION 17): июньский слух и обещание переписаны — прежние записи переносятся на новые id;
      // записи с неизвестными id отбрасываются, чтобы заметки не ломались
      const RENAME = { pavel_neighbor_cart: 'pavel_neighbor_price', tell_pavel_carrier: 'tell_pavel_price' };
      [['heard', RUMORS], ['promises', PROMISES]].forEach(([f, known]) => Object.keys(s[f]).forEach(k => {
        if (RENAME[k] && !s[f][RENAME[k]]) s[f][RENAME[k]] = s[f][k];
        if (!known[k]) delete s[f][k];
      }));
      Object.keys(s.heard).forEach(k => { if (!Array.isArray(s.heard[k].ctx)) s.heard[k].ctx = []; });
      Object.keys(s.ctx).forEach(k => { if (!CONTEXT[k]) delete s.ctx[k]; });
      if (s.ctx.mother_same_source && s.heard.pavel_neighbor_price)        // текст дополнения матери тоже переписан
        s.heard.pavel_neighbor_price.ctx = s.heard.pavel_neighbor_price.ctx.map(t => t.startsWith('Мать:') ? CONTEXT.mother_same_source.text : t);
      if (!s.orders || typeof s.orders !== 'object') s.orders = {};     // миграция: заказов у оптовика раньше не было
      Object.keys(s.orders).forEach(id => { const o = s.orders[id];      // неизвестный продавец или товар, нелепое количество — отбрасываются
        if (!SUPPLY[id] || !o || typeof o !== 'object') return delete s.orders[id];
        Object.keys(o).forEach(k => { if (!GOODS[k] || !Number.isInteger(o[k]) || o[k] <= 0) delete o[k]; }); });
      return s;
    }
  } catch (e) {}
  return null;
}

const $ = id => document.getElementById(id);
const canvas = $('game'); canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
// Режим экрана (F или кнопка, запоминается в браузере):
//   fill  — во весь экран без полей: кадр рисуется резко в целое число раз крупнее нужного (px) и плавно уменьшается под окно,
//           поэтому все пиксели одинаковой ширины, края чуть мягче;
//   pixel — пиксель в пиксель: только целое увеличение, по краям могут быть поля.
const SCREEN_KEY = 'letopisi1812_screen';
let screenMode = (() => { try { return localStorage.getItem(SCREEN_KEY) === 'pixel' ? 'pixel' : 'fill'; } catch (e) { return 'fill'; } })();
let px = 1;                                            // во сколько раз холст крупнее сетки 480×270
function fit() {
  const exact = Math.min(innerWidth / W, innerHeight / H);
  const s = screenMode === 'fill' ? exact : Math.max(1, Math.floor(exact));
  px = screenMode === 'fill' ? Math.max(1, Math.ceil(exact - 1e-6)) : 1;
  if (canvas.width !== W * px) { canvas.width = W * px; canvas.height = H * px; ctx.imageSmoothingEnabled = false; }
  canvas.style.imageRendering = Math.abs(s - px) < 1e-6 || px === 1 ? 'pixelated' : 'auto';
  $('stage').style.setProperty('--s', s); $('stage').style.setProperty('--u', s * 1.5);
  $('screenbtn').textContent = screenMode === 'fill' ? 'Экран: весь (F)' : 'Экран: точный (F)';
}
function toggleScreen() {
  screenMode = screenMode === 'fill' ? 'pixel' : 'fill';
  try { localStorage.setItem(SCREEN_KEY, screenMode); } catch (e) {}
  fit();
}
addEventListener('resize', fit); fit();

// ================= ЗАГРУЗКА ГРАФИКИ =================
// Любой файл может отсутствовать: тогда рисуется временная заглушка и игра продолжается.
// Подробности (какой файл, какой размер) — только в консоли браузера (F12); на экране при необходимости
// одна короткая надпись «Временная графика». Необязательный слой (передний план) надписи не вызывает, если его просто нет.
const spr = {}, problems = [];
function loadImage(key, src, w, h, optional, note) {
  const im = new Image(); im.ok = false; spr[key] = im;
  im.onload = () => {
    if (im.width === w && im.height === h) im.ok = true;
    else { if (!optional) problems.push(src); console.warn('[графика] ' + src + ': размер ' + im.width + '×' + im.height + ', нужен ' + w + '×' + h + '. ' + (note || 'Показана заглушка.')); }
  };
  im.onerror = () => {
    if (optional) console.info('[графика] ' + src + ' не найден (необязательный файл).');
    else { problems.push(src); console.warn('[графика] ' + src + ' не найден. ' + (note || 'Показана заглушка.')); }
  };
  im.src = src;
}
loadImage('walk', ANDREY.walk.src, ANDREY.cellW * ANDREY.walk.frames, ANDREY.cellH, false,
  'Покадровой ходьбы пока нет: при ходьбе показывается статичный кадр покоя (это НЕ готовая анимация).');

if (ANDREY.give) loadImage('give', ANDREY.give.src, ANDREY.cellW * ANDREY.give.frames, ANDREY.cellH, true);
loadImage('bg', ART.background.src, SCENE.worldW, H);
loadImage('counter', ART.counterFront.src, SCENE.worldW, H, true);
loadImage('front', ART.foreground.src, SCENE.worldW, H, false, 'Без слоя ящиков Андрей у двери рисуется поверх них.');
if (ART.glass) loadImage('glass', ART.glass.src, SCENE.worldW, H, true);
const HD_ON = !/[?&]hd=0\b/.test(location.search);   // ?hd=0 — фон лавки обычными пиксельными слоями
if (HD_ON) [['bgHd', ART.background], ['counterHd', ART.counterFront], ['frontHd', ART.foreground]].forEach(([k, a]) => {
  if (a.hd) loadImage(k, a.hd, SCENE.worldW * ART.hdScale, H * ART.hdScale, true, 'Рисуется обычный слой.');
  if (a.hdNight) loadImage(k + 'Night', a.hdNight, SCENE.worldW * ART.hdScale, H * ART.hdScale, true, 'Рисуется дневной слой.'); });
const isNight = () => LIGHT_ON && !!(TIME.light[state.phase] || {}).night;
function drawHd(key) {                                 // слой в высоком разрешении: плавно уменьшается под холст; ночью — ночная версия

}
Object.keys(SCENES).forEach(id => loadImage('bg_' + id, SCENES[id].background, SCENES[id].worldW, H));
speakers().forEach(x => { if (x.sprite) loadImage('s_' + x.id, x.sprite.src, x.sprite.cellW, x.sprite.cellH, false, 'Показан человечек-заглушка.'); });

const nearWork = () => inShop() && !dlg && !serving && near(SCENE.workX);      // рабочее место за прилавком

const keys = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;                                // удержание клавиши не повторяет действие
  sfx.unlock();                                        // звук можно включить только после действия игрока (правило браузеров)
  if (e.code === 'KeyF') { toggleScreen(); return; }   // режим экрана — в любой момент
  if (e.code === 'KeyS') { sfx.toggle(); return; }     // звук — в любой момент
  if (cine) { if (e.code === 'Escape') endCine(); else if (['KeyE', 'Space', 'Enter'].includes(e.code)) cineNext(); return; }   // сцена-ролик
  if (sleeping) return;                                // ночью остальной ввод не действует
  if (e.code === 'KeyM' && !serving) { mapOpen = !mapOpen; if (mapOpen) mapId = MAP.start; renderMap(); return; }
  if (mapOpen) { if (e.code === 'Escape') { mapOpen = false; renderMap(); } return; }   // пока открыта карта, остальные клавиши не действуют
  if (e.code === 'KeyN' || (e.code === 'Escape' && notesOpen)) { notesOpen = !notesOpen; renderNotes(); return; }
  if (e.code === 'Escape' && serving) { stepAway(); return; }
  if (e.code !== 'KeyE' || notesOpen) return;
  if (nearMom()) showNode(MOTHER.node);
  else if (nearWork()) ({ morning: openShop, day: enterService, evening: endDay })[state.phase]();
  else if (nearNpc()) showNode(nearNpc().node);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const mkCv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function crisp(cv) {                                    // альфа только 0 или 255, как у всей графики игры

  dirs.forEach(([dx, dy]) => { const one = mkCv(cv.width, cv.height), g = one.getContext('2d');

  catch (e) {}                                          // игра открыта файлом и слой — картинка: огонь стоит на условной линии крыш
  return top;
}
const tintCache = new Map();
function tinted(cv, color) {                            // силуэт, залитый одним цветом (кэш по цвету: цветов палитры немного)

  if (!tintCache.has(key)) { const t = mkCv(cv.width, cv.height), g = t.getContext('2d');

// ----- Временная графика слоёв: силуэты Москвы -----
function onion(g, x, y, w) {                            // луковичная глава на барабане, с крестом; y — низ барабана
  g.fillRect(x - w * 0.3, y - w * 0.9, w * 0.6, w * 0.9);

  g.beginPath(); g.moveTo(x - w * 0.42, y - w * 1.45); g.quadraticCurveTo(x, y - w * 1.7, x, y - w * 2.25); g.quadraticCurveTo(x, y - w * 1.7, x + w * 0.42, y - w * 1.45); g.fill();
  g.fillRect(x - 0.5, y - w * 2.25 - 5, 1, 5); g.fillRect(x - 2, y - w * 2.25 - 3.5, 4, 1);

function tent(g, x, y, w, bodyH, roofH) {               // башня с шатром (как кремлёвские); y — низ башни

  g.beginPath(); g.moveTo(x - w * 0.42, y - bodyH - 6); g.lineTo(x, y - bodyH - 6 - roofH); g.lineTo(x + w * 0.42, y - bodyH - 6); g.fill();
  g.fillRect(x - 0.5, y - bodyH - 10 - roofH, 1, 5);
}
function house(g, x, base, w, h, roof) {                // дом с двускатной крышей и трубой
  g.fillRect(x, base - h, w, h);
  g.beginPath(); g.moveTo(x - 2, base - h); g.lineTo(x + w / 2, base - h - roof); g.lineTo(x + w + 2, base - h); g.fill();
  g.fillRect(x + w * 0.7, base - h - roof * 0.8, 3, roof * 0.6);
}
const CINE_ART = {
  far(w, r) {                                           // дальний город: Кремль с колокольней Ивана Великого, соборы, слободы
    const cv = mkCv(w, H), g = cv.getContext('2d'); g.fillStyle = '#000'; const B = 206;
    for (let x = -10; x < w; ) { const hw = 10 + r() * 22; house(g, x, B, hw, 6 + r() * 14, 4 + r() * 6); x += hw + r() * 4; }
    for (let x = 30; x < w; x += 70 + r() * 60) if (x < 140 || x > 480) { g.fillRect(x - 9, B - 26, 18, 26); onion(g, x, B - 26, 9); if (r() < 0.6) { tent(g, x + 16, B, 7, 30, 16); } }
    g.fillRect(150, B - 18, 330, 18);                   // кремлёвская стена с зубцами
    for (let x = 150; x < 480; x += 6) g.fillRect(x, B - 22, 3, 4);
    [[150, 12, 30, 18], [222, 11, 26, 16], [300, 14, 40, 26], [395, 11, 28, 16], [480, 12, 30, 18]].forEach(([x, tw, bh, rh]) => tent(g, x, B, tw, bh, rh));
    g.fillRect(250, B - 58, 40, 40); onion(g, 262, B - 58, 10); onion(g, 280, B - 58, 10); onion(g, 271, B - 62, 13);   // соборы
    const iv = 345; g.fillRect(iv - 9, B - 60, 18, 42); g.fillRect(iv - 8, B - 84, 16, 24); g.fillRect(iv - 7, B - 102, 14, 18);   // Иван Великий
    g.fillRect(iv - 5, B - 112, 10, 10); onion(g, iv, B - 112, 9);
    g.fillRect(360, B - 46, 34, 28); onion(g, 377, B - 46, 9);
    return crisp(cv);
  },
  mid(w, r) {                                           // Китай-город: Гостиный двор с арками, крыши, колокольни
    const cv = mkCv(w, H), win = mkCv(w, H), g = cv.getContext('2d'), gw = win.getContext('2d'); g.fillStyle = gw.fillStyle = '#000'; const B = 246;
    for (let x = -10; x < w; ) { const hw = 22 + r() * 34, hh = 20 + r() * 34; house(g, x, B, hw, hh, 8 + r() * 12);
      for (let wy = B - hh + 6; wy < B - 8; wy += 11) for (let wx = x + 4; wx < x + hw - 5; wx += 9) if (r() < 0.55) gw.fillRect(wx, wy, 3, 5);
      x += hw + 3 + r() * 8; }
    g.fillRect(200, B - 44, 230, 44); g.fillRect(196, B - 48, 238, 4);   // Гостиный двор: два яруса арок
    for (let x = 206; x < 424; x += 14) { gw.fillRect(x, B - 38, 7, 10); gw.fillRect(x, B - 20, 7, 14); }
    [[120, 13], [520, 15], [650, 12]].forEach(([x, s]) => { g.fillRect(x - 6, B - 70, 12, 70); g.fillRect(x - 5, B - 84, 10, 14); onion(g, x, B - 84, s * 0.6); });
    crisp(cv); crisp(win);

  },
  near(w, r) {                                          // улица у лавки: земля, забор с воротами, фонарь, телега, бочка

    g.fillRect(0, 258, w, H - 258);

    for (let x = 0; x < w; x += 7) { if (x > 250 && x < 420) continue; const h = 16 + Math.floor(r() * 5); g.fillRect(x, 258 - h, 5, h); g.fillRect(x + 1, 258 - h - 2, 3, 2); }
    g.fillRect(0, 246, 250, 2); g.fillRect(420, 246, w - 420, 2);
    g.fillRect(246, 232, 5, 26); g.fillRect(420, 232, 5, 26);   // столбики ворот
    g.fillRect(470, 178, 3, 80); g.fillRect(466, 170, 11, 9); g.fillRect(468, 166, 7, 4);   // фонарь

function silhouette(img, sx, sw, sh) {                  // силуэт персонажа из его спрайта (один кадр)
  const cv = mkCv(sw, sh), g = cv.getContext('2d'); g.drawImage(img, sx, 0, sw, sh, 0, 0, sw, sh);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#000'; g.fillRect(0, 0, sw, sh); return cv;
}

Object.keys(CUTSCENES).forEach(id => { const d = CUTSCENES[id];
  Object.keys(d.layers).forEach(k => { if (d.layers[k].src) loadImage('cine_' + id + '_' + k, d.layers[k].src, d.worldW, H, true); }); });
DAYS.forEach((d, i) => { if (d.cutscene && !CUTSCENES[d.cutscene]) console.error('[данные] день ' + (i + 1) + ': нет сцены ' + d.cutscene); });
const smokeCv = mkCv(W, H), sg = smokeCv.getContext('2d');
const tintCv = mkCv(W, H), tg = tintCv.getContext('2d');
function tinted0(cv, color) {                           // то же, что tinted, но без кэша (для дыма, он меняется каждый кадр)
  tg.globalCompositeOperation = 'source-over'; tg.clearRect(0, 0, W, H); tg.drawImage(cv, 0, 0);
  tg.globalCompositeOperation = 'source-in'; tg.fillStyle = color; tg.fillRect(0, 0, W, H); return tintCv;
}
let cine = null;                                        // идёт сцена: { def, n (кадр), t, parts, done }
function buildCine(def) {                               // слои собираются один раз при первом показе
  if (def.built) return def.built;
  const r = rng(1812), w = def.worldW, b = {};
  ['far', 'mid', 'near'].forEach(k => {
    const L = def.layers[k], im = spr['cine_' + def.id + '_' + k];
    if (im && im.ok) { b[k] = mkCv(w, H); b[k].getContext('2d').drawImage(im, 0, 0); }
    else { const a = CINE_ART[k](w, r); if (Array.isArray(a)) { b[k] = a[0]; b[k + 'Win'] = a[1]; } else b[k] = a; }
    b[k + 'Rim'] = rimOf(b[k], k === 'far' ? [[0, -1]] : [[0, -1], [1, 0]]);
    b[k + 'Top'] = roofline(b[k], { far: 190, mid: 215, near: 250 }[k]); b[k + 'Par'] = L.par;
  });
  // очаги огня: в Китай-городе (mid) от Гостиного двора вширь, позже — по дальнему городу; th — с какой силы пожара горит очаг
  b.fires = [];
  for (let i = 0; i < 18; i++) { const x = 40 + r() * (w - 80); b.fires.push({ layer: 'mid', x, s: 12 + r() * 16, th: Math.min(0.95, 0.08 + Math.abs(x - 315) / 420 + r() * 0.15), seed: r() * 99 }); }
  for (let i = 0; i < 14; i++) { const x = 20 + r() * 560; b.fires.push({ layer: 'far', x, s: 6 + r() * 7, th: 0.45 + r() * 0.5, seed: r() * 99 }); }
  b.stars = Array.from({ length: 40 }, () => [Math.floor(r() * W), Math.floor(CINE.bar + r() * 110)]);
  const sil = (key, sp) => sp && spr[key] && spr[key].ok ? silhouette(spr[key], 0, sp.cellW, sp.cellH) : null;
  b.andrey = sil('idle', { cellW: ANDREY.cellW, cellH: ANDREY.cellH }); b.mother = sil('s_mother', MOTHER.sprite);
  b.andreyRim = b.andrey && rimOf(b.andrey, [[1, 0], [0, -1]]); b.motherRim = b.mother && rimOf(b.mother, [[1, 0], [0, -1]]);
  return def.built = b;
}
async function playCutscene(id) {
  const def = CUTSCENES[id]; if (!def) { console.error('[данные] нет сцены ' + id); return; }
  def.id = id;
  const imgs = [spr.idle, spr.s_mother, ...Object.keys(def.layers).map(k => spr['cine_' + id + '_' + k])].filter(Boolean);   // ждём картинки (сразу после загрузки страницы)
  await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.addEventListener('load', r); im.addEventListener('error', r); })));
  buildCine(def);
  return new Promise(done => {
    cine = { def, n: 0, t: 0, smoke: [], embers: [], bellT: 1.5, done };
    document.body.classList.add('cine'); showCineText();
  });
}
function cineNext() {
  if (!cine || cine.t < 0.4) return;                    // случайное двойное нажатие не пропускает кадр
  cine.n++; cine.t = 0;
  if (cine.n >= cine.def.shots.length) return endCine();
  showCineText();
}
function endCine() {
  const done = cine.done; cine = null; sfx.fire(-1);
  document.body.classList.remove('cine'); $('cine').className = ''; done();
}
function showCineText() {
  const s = cine.def.shots[cine.n], el = $('cine');
  el.innerHTML = (s.fact ? '<div class="fact"><b>' + s.fact.title + '</b><p>' + s.fact.text + '</p></div>' : '') +
    (s.text ? '<div class="cap">' + s.text + '</div>' : '') + '<small>E — дальше · Esc — пропустить</small>';
  el.className = 'on'; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
const shotHeat = () => { const s = cine.def.shots[cine.n], k = ease(Math.min(1, cine.t / s.time)); return s.heat[0] + (s.heat[1] - s.heat[0]) * k; };
function updateCine(dt) {
  const s = cine.def.shots[cine.n]; cine.t += dt;
  if (cine.t >= s.time) { cine.t = s.time; cineNext(); if (!cine) return; }
  const heat = shotHeat(), b = cine.def.built;
  sfx.fire(heat);
  if (heat > 0.25 && (cine.bellT -= dt) < 0) { sfx.nabat(); cine.bellT = 2.6; }   // набат: били в колокола, созывая на пожар
  b.fires.forEach(f => { if (heat < f.th || Math.random() > dt * (f.layer === 'far' ? 1.2 : 2.2) * heat) return;
    cine.smoke.push({ layer: f.layer, x: f.x + rnd(-4, 4), y: b[f.layer + 'Top'][Math.round(f.x)] - f.s * 0.6, r: f.s * 0.35, vx: rnd(-10, -4), vy: rnd(-14, -8), age: 0, life: rnd(5, 9) }); });
  if (Math.random() < dt * 60 * Math.max(0, heat - 0.25)) cine.embers.push({ x: rnd(0, W + 120), y: H - CINE.bar + 4, vx: rnd(-14, 4), vy: rnd(-34, -16), age: 0, life: rnd(3, 6), seed: rnd(0, 9) });
  [cine.smoke, cine.embers].forEach(list => list.forEach(p => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.r) p.r += dt * 2.2; }));
  cine.smoke = cine.smoke.filter(p => p.age < p.life).slice(-160); cine.embers = cine.embers.filter(p => p.age < p.life && p.y > 0).slice(-140);
}
function flame(x, y, s, t, seed) {                      // язык пламени из пиксельных строк: снаружи тёмно-оранжевый, внутри жёлтый
  const h = Math.round(s * (0.8 + 0.2 * Math.sin(t * 5 + seed)));
  for (let i = 0; i < h; i++) { const k = i / h, off = Math.round(Math.sin(t * 6 + seed + i * 0.35) * k * 3), w = Math.max(1, Math.round(s * 0.4 * (1 - k) * (1 + 0.25 * Math.sin(t * 9 + seed + i * 0.6))));
    rect(k > 0.7 ? '#C15309' : '#D95E07', x + off - w, y - i, w * 2, 1);
    if (k < 0.75 && w > 1) rect('#FA9521', x + off - Math.ceil(w * 0.55), y - i, Math.ceil(w * 0.55) * 2, 1);
    if (k < 0.4 && w > 2) rect('#FBB956', x + off - Math.ceil(w * 0.25), y - i, Math.ceil(w * 0.25) * 2, 1); }
}
function drawCine() {
  const def = cine.def, b = def.built, s = def.shots[cine.n], heat = shotHeat(), t = performance.now() / 1000;
  const cam = Math.round(s.cam[0] + (s.cam[1] - s.cam[0]) * ease(Math.min(1, cine.t / s.time)));
  if (canvas.style.filter) canvas.style.filter = '';
  let y = 0; CINE.bands.forEach((h, i) => { rect(mixPal(CINE.sky[0][i], CINE.sky[1][i], heat), 0, y, W, h); y += h; });   // небо полосами, без плавного перехода
  if (heat < 0.35) b.stars.forEach(([x, sy], i) => { if ((i + Math.floor(t * 0.7)) % 7) rect(rgba('#EFDCBA', 1 - heat * 3), x, sy, 1, 1); });
  const layer = k => {
    const ox = -Math.round(cam * b[k + 'Par']);
    ctx.drawImage(tinted(b[k], mixPal(CINE[k][0], CINE[k][1], heat)), ox, 0);
    ctx.drawImage(tinted(b[k + 'Rim'], mixPal(CINE[k + 'Rim'][0], CINE[k + 'Rim'][1], heat)), ox, 0);
    if (b[k + 'Win'] && heat > 0.2) { ctx.globalAlpha = Math.min(1, (heat - 0.2) * 2) * (0.8 + 0.2 * flick(t, 3, 1)); ctx.drawImage(tinted(b[k + 'Win'], mixPal(CINE.win[0], CINE.win[1], heat)), ox, 0); ctx.globalAlpha = 1; }
    ctx.save(); ctx.translate(ox, 0);
    const lit = b.fires.filter(f => f.layer === k && heat >= f.th);
    ctx.globalCompositeOperation = 'lighter';           // зарево над очагами
    lit.forEach(f => { const fy = b[k + 'Top'][Math.round(f.x)], R = f.s * 3.2, gr = ctx.createRadialGradient(f.x, fy, 0, f.x, fy, R);
      gr.addColorStop(0, rgba('#F47106', 0.35 * flick(t, f.seed, 0.15))); gr.addColorStop(1, rgba('#F47106', 0)); ctx.fillStyle = gr; ctx.fillRect(f.x - R, fy - R, R * 2, R * 2); });
    ctx.globalCompositeOperation = 'source-over';
    const sm = cine.smoke.filter(p => p.layer === k);   // дым одним пятном: клубы сливаются в столб, без тёмных наложений
    if (sm.length) { sg.clearRect(0, 0, W, H); sg.fillStyle = '#000';
      sm.forEach(p => { const rr = Math.round(p.r * Math.min(1, p.age * 1.5) * (1 - 0.5 * p.age / p.life)); if (rr > 0) { sg.beginPath(); sg.arc(Math.round(p.x + ox), Math.round(p.y), rr, 0, Math.PI * 2); sg.fill(); } });
      crisp(smokeCv); ctx.save(); ctx.setTransform(px, 0, 0, px, 0, 0); ctx.globalAlpha = 0.72; ctx.drawImage(tinted0(smokeCv, mixPal(CINE.smoke[0], CINE.smoke[1], heat)), 0, 0); ctx.restore(); }
    lit.forEach(f => { const fy = b[k + 'Top'][Math.round(f.x)] + 2, grow = Math.min(1, (heat - f.th) * 4);
      for (let j = -1; j <= 1; j++) flame(Math.round(f.x + j * f.s * 0.45), fy, f.s * grow * (j ? 0.65 : 1), t, f.seed + j * 2); });
    ctx.restore();
  };
  layer('far'); layer('mid'); layer('near');
  if (s.figures) {                                      // Андрей и мать смотрят на пожар
    const fx = def.figures.x - cam, fy = def.figures.y, rim = mixPal(CINE.figRim[0], CINE.figRim[1], heat);
    const fig = (cv, rimCv, x, sp, fallbackH) => { if (cv) { ctx.drawImage(tinted(cv, CINE.fig), x - sp.anchorX, fy - sp.floorY); ctx.drawImage(tinted(rimCv, rim), x - sp.anchorX, fy - sp.floorY); }
      else { rect(CINE.fig, x - 8, fy - fallbackH, 16, fallbackH); rect(rim, x + 7, fy - fallbackH, 1, fallbackH); } };
    fig(b.mother, b.motherRim, fx - 34, MOTHER.sprite, 90); fig(b.andrey, b.andreyRim, fx + 6, ANDREY, 100);
  }
  cine.embers.forEach(p => { const a = 1 - p.age / p.life; rect(rgba(p.seed > 4.5 ? '#FBB956' : '#FA9521', a), Math.round(p.x - cam * 0.15 + Math.sin(t * 2 + p.seed) * 3), Math.round(p.y), p.seed > 7 ? 2 : 1, 1); });
  if (heat > 0.5) { ctx.globalCompositeOperation = 'lighter'; rect(rgba('#911104', (heat - 0.5) * 0.25 * flick(t, 1, 0.2)), 0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }   // красный отсвет на всём
  const fade = s.fade || 0, k = fade ? Math.max(0, 1 - Math.min(cine.t, s.time - cine.t) / fade) : 0;
  if (k > 0) rect(rgba('#05070d', k), 0, 0, W, H);
  rect('#000', 0, 0, W, CINE.bar); rect('#000', 0, H - CINE.bar, W, CINE.bar);
}

// ================= ГЛАВНЫЙ ЦИКЛ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}

const askScene = new URLSearchParams(location.search).get('scene');   // index.html?scene=fire — посмотреть сцену без прохождения

else if (!loaded) intro();                             // новая игра (сохранения нет): заголовок первой главы
