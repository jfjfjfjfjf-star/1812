<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Летописи: 1812</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0805; overflow: hidden; font-family: Georgia, serif; }
  /* Сцена всегда в целое число раз больше 320x180 (переменная --s): пиксели остаются чёткими */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: calc(var(--s) * 320px); height: calc(var(--s) * 180px); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud, #hint, #newgame, #dbg { position: absolute; color: #f0e2c0; font-size: calc(var(--s) * 5px); text-shadow: 1px 1px #000; }
  #hud { right: calc(var(--s) * 4px); top: calc(var(--s) * 3px); }
  #hint { left: 0; right: 0; top: calc(var(--s) * 13px); text-align: center; display: none; }
  #newgame { left: calc(var(--s) * 4px); top: calc(var(--s) * 3px); background: none; border: 1px solid #f0e2c066;
             font-family: inherit; opacity: .6; cursor: pointer; }
  #dbg { left: calc(var(--s) * 4px); top: calc(var(--s) * 13px); color: #f08a8a; }
  #dlg { position: absolute; left: 0; right: 0; bottom: 0; display: none; }
  #choices { display: flex; flex-direction: column; gap: calc(var(--s) * 2px); margin: 0 20% calc(var(--s) * 3px); }
  #choices button { font: inherit; font-size: calc(var(--s) * 6px); padding: calc(var(--s) * 2px); cursor: pointer;
                    background: #2a1a0e; color: #f0e2c0; border: 2px solid #c9a96a; }
  #choices button:disabled { opacity: .4; cursor: not-allowed; }
  #box { background: rgba(20,12,6,.92); border-top: 2px solid #c9a96a; color: #f0e2c0;
         padding: calc(var(--s) * 4px) calc(var(--s) * 8px); min-height: calc(var(--s) * 30px);
         font-size: calc(var(--s) * 7px); line-height: 1.35; }
  #who { color: #e8c36a; font-weight: bold; min-height: 1.35em; }
  #box { white-space: pre-line; }
  #mid { display: flex; align-items: flex-end; }
  #choices { margin: 0 0 calc(var(--s) * 3px) 4%; flex: 1; }
  #panel { display: none; width: 42%; margin: 0 calc(var(--s) * 4px) calc(var(--s) * 3px) 0; box-sizing: border-box;
           background: rgba(20,12,6,.92); border: 2px solid #c9a96a; color: #f0e2c0; padding: calc(var(--s) * 3px);
           font-size: calc(var(--s) * 5px); line-height: 1.4; }
  #panel i { opacity: .7; } #panel button { font: inherit; padding: 0 calc(var(--s) * 3px); cursor: pointer; }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--s) * 24px); display: none;
           background: rgba(20,12,6,.92); border: 2px solid #e8c36a; color: #f0e2c0; padding: calc(var(--s) * 2px) calc(var(--s) * 6px);
           font-size: calc(var(--s) * 6px); }
  #notes { position: absolute; inset: calc(var(--s) * 10px) calc(var(--s) * 30px); display: none; overflow: auto; box-sizing: border-box;
           background: rgba(20,12,6,.96); border: 2px solid #c9a96a; color: #f0e2c0; padding: calc(var(--s) * 4px) calc(var(--s) * 8px);
           font-size: calc(var(--s) * 6px); line-height: 1.35; }
  #notes h3 { margin: 0 0 calc(var(--s) * 3px); } #notes p { margin: 0 0 calc(var(--s) * 3px); }
  #notesbtn { position: absolute; left: calc(var(--s) * 52px); top: calc(var(--s) * 3px); background: none; border: 1px solid #f0e2c066;
              color: #f0e2c0; font-family: inherit; font-size: calc(var(--s) * 5px); opacity: .6; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="newgame">Новая игра</button><button id="notesbtn">Заметки (N)</button><div id="toast"></div><div id="notes"></div>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="dbg"></div>
  <div id="dlg"><div id="mid"><div id="choices"></div><div id="panel"></div></div><div id="box"><div id="who"></div><div id="text"></div></div></div>
</div>
<script src="data.js"></script>
<script>
// ================= НАСТРОЙКИ ЭКРАНА =================
const W = 320, H = 180;                                // утверждённая сетка пикселей
const FLOOR = { l: 8, r: 312, top: 131, bot: 168 };    // полоса пола: сюда ставятся ноги Андрея

// ================= РАЗГОВОРЫ И ТОРГОВЛЯ (логика; реплики, числа и условия — в data.js) =================
const P = PAVEL;
const deal = () => state.deal;
const total = d => d.qty * d.price;
const profit = d => d.qty * (d.price - GOODS[P.want].cost);
const fmt = (t, v) => t.replace(/\{(\w+)\}/g, (_, k) => (v && v[k] !== undefined ? v[k] : ''));
const dealVars = d => ({ rev: total(d), cost: d.qty * GOODS[P.want].cost, profit: profit(d), left: state.stock[P.want] });
const heard = id => !!state.heard[id];
const okChoice = c => (!c.need || !c.need.heard || heard(c.need.heard)) && !(c.once && c.id && state.asked[c.id]);

function learn(id) {                                   // сведение записывается один раз
  if (!id || heard(id)) return;
  state.heard[id] = { n: Object.keys(state.heard).length + 1 };
  if (RUMORS[id].toast) toast(RUMORS[id].toast);
  save();
}
function showNode(id) { const n = NODES[id]; learn(n.learn); dlg = { node: n }; renderDlg(); }
function showTrade(msg) { if (msg) deal().msg = msg; dlg = { trade: true }; renderDlg(); }
function leave() { const d = deal(); d.stage = 'after'; d.sold = false; d.afterNode = P.refusedNode; save(); showNode(d.afterNode); }
function sell() {                                      // деньги и товар меняются только здесь и только один раз
  const d = deal();
  if (d.stage === 'after' || d.stage === 'done' || d.qty > state.stock[P.want]) return;
  d.stage = 'after'; d.sold = true; d.afterNode = P.soldNode;
  state.money += total(d); state.stock[P.want] -= d.qty;
  save(); showNode(P.soldNode);
}
function offer() {
  const d = deal();
  if (d.price <= P.maxUnit) return sell();             // скрытый предел покупателя
  if (--d.patience <= 0) return leave();               // терпение кончилось
  d.counter = P.counterUnit;
  save(); showTrade(fmt(P.counterMsg, { offer: total(d), counter: d.counter * d.qty }));
}
function step(k) { const d = deal(); d.price = Math.max(1, Math.min(30, d.price + k)); save(); renderDlg(); }
function tradeChoices() {
  const d = deal(), l = [{ text: 'Предложить ' + total(d) + ' монет', do: 'offer' }];
  if (d.counter) l.push({ text: 'Согласиться на ' + d.counter * d.qty, do: 'accept' });
  if (d.qty > P.altQty) l.push({ text: 'Продать только ' + P.altQty, do: 'qty' });
  return l.concat(P.tradeTalk.filter(okChoice), [{ text: 'Отказаться', do: 'refuse' }]);
}
function inspect() {
  const g = GOODS[P.want];
  dlg = { node: { who: 'Прилавок', text: g.name + ': закупка ' + g.cost + ', обычная цена ' + g.price + ', в наличии ' + state.stock[P.want] + '.',
                  choices: [{ text: 'Закрыть', do: 'end' }] } };
  renderDlg();
}
function act(c) {
  if (c.id) state.asked[c.id] = true;
  if (c.promise && !state.promises[c.promise]) state.promises[c.promise] = { done: false };
  const d = deal(), op = c.do || '';
  if (op === 'trade') { d.stage = 'price'; return offer(); }
  if (op === 'offer') return offer();
  if (op === 'accept') { d.price = d.counter; return sell(); }
  if (op === 'qty') { d.qty = Math.min(P.altQty, state.stock[P.want]); d.counter = 0; save(); return showTrade(P.qtyMsg); }
  if (op === 'refuse') return leave();
  if (op === 'back') return d.stage === 'open' ? showNode(P.openNode) : d.stage === 'price' ? showTrade() : showNode(d.afterNode);
  if (op === 'finish' && d.stage === 'after') d.stage = 'done';
  if (c.goto) { save(); return showNode(c.goto); }
  save(); dlg = null; renderDlg();                     // 'end' и 'finish': закрыть разговор
}

// ================= СОСТОЯНИЕ И СОХРАНЕНИЕ =================
const SAVE_KEY = 'letopisi1812_save_v4';
const newState = () => ({ money: START.money, stock: { ...START.stock }, heard: {}, asked: {}, promises: {},
  deal: { stage: 'open', qty: P.qty, price: GOODS[P.want].price, patience: P.patience, counter: 0, msg: '', sold: false, afterNode: '' } });
let state = load() || newState();
let dlg = null, notesOpen = false;                     // dlg: {node} или {trade:true} или null

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s.money === 'number' && s.stock && typeof s.stock[P.want] === 'number' && s.heard && s.asked &&
        s.promises && s.deal && typeof s.deal.stage === 'string' && typeof s.deal.qty === 'number' &&
        typeof s.deal.price === 'number') return s;
  } catch (e) {}
  return null;
}

// ================= ЭКРАН =================
const $ = id => document.getElementById(id);
const canvas = $('game'); canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  $('stage').style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();

// ================= ЗАГРУЗКА СПРАЙТОВ =================
// Если файла нет или у него не тот размер, спрайт не используется, рисуется заглушка,
// а причина выводится красным текстом в углу экрана.
const spr = {}, problems = [];
function loadSprite(key, src, w, h) {
  const im = new Image(); im.ok = false; spr[key] = im;
  im.onload = () => {
    if (im.width === w && im.height === h) im.ok = true;
    else problems.push(src + ': размер ' + im.width + '×' + im.height + ', нужен ' + w + '×' + h);
  };
  im.onerror = () => problems.push(src + ' не найден, показана заглушка');
  im.src = src;
}
loadSprite('walk', ANDREY.walk.src, ANDREY.cellW * ANDREY.walk.frames, ANDREY.cellH);
loadSprite('idle', ANDREY.idle.src, ANDREY.cellW, ANDREY.cellH);

// ================= ПЕРСОНАЖИ И ЗОНЫ =================
const player = { x: 80, y: 151, speed: 47, dist: 0, dir: 1, moving: false };
const spot = { x: 233, y: 151 }, momSpot = { x: 110, y: 151 };
const near = p => Math.abs(player.x - p.x) < 23 && Math.abs(player.y - p.y) < 8;
const pavelHere = () => deal().stage !== 'done';
const nearPavel = () => !dlg && pavelHere() && near(spot);
const nearMom = () => !dlg && near(momSpot);
const nearCounter = () => !dlg && !nearPavel() && player.x > 127 && player.y <= 141;

// ================= УПРАВЛЕНИЕ =================
const keys = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyN' || (e.code === 'Escape' && notesOpen)) { notesOpen = !notesOpen; renderNotes(); return; }
  if (e.code !== 'KeyE' || notesOpen) return;
  if (nearPavel()) { const d = deal(); d.stage === 'price' ? showTrade() : showNode(d.stage === 'open' ? P.openNode : d.afterNode); }
  else if (nearMom()) showNode('mother_hub');
  else if (nearCounter()) inspect();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
$('newgame').onclick = e => { state = newState(); dlg = null; notesOpen = false; save(); renderDlg(); renderNotes(); e.target.blur(); };
$('notesbtn').onclick = e => { notesOpen = !notesOpen; renderNotes(); e.target.blur(); };

// ================= ДИАЛОГ, ПАНЕЛЬ ЦЕНЫ, ЗАМЕТКИ =================
function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
function renderDlg() {
  const box = $('dlg'), ch = $('choices'), pn = $('panel');
  ch.innerHTML = ''; pn.innerHTML = ''; pn.style.display = 'none';
  if (!dlg) { box.style.display = 'none'; return; }
  const d = deal(); let who, text, list;
  if (dlg.trade) {
    who = P.name; text = d.msg; list = tradeChoices();
    const g = GOODS[P.want];
    pn.style.display = 'block';
    pn.innerHTML = '<b>' + g.name + ' ×' + d.qty + '</b><br>Остаток: ' + state.stock[P.want] + ' <i>— столько есть в лавке</i><br>' +
      'Закупка: ' + g.cost + ' <i>— за столько купили</i><br>Цена продажи: <button id="pm">−</button> <b>' + d.price +
      '</b> <button id="pp">+</button><br>Всего: <b>' + total(d) + '</b><br>Прибыль: <b>' + profit(d) + '</b> <i>— заработок после вычета закупки</i>';
    $('pm').onclick = () => step(-1); $('pp').onclick = () => step(1);
  } else {
    who = dlg.node.who || ''; text = fmt(dlg.node.text, dealVars(d)); list = dlg.node.choices.filter(okChoice);
  }
  box.style.display = 'block';
  $('who').textContent = who; $('text').textContent = text;
  list.forEach(c => {
    const b = document.createElement('button'); b.textContent = c.text; b.onclick = () => act(c); ch.appendChild(b);
  });
}
function renderNotes() {
  const el = $('notes'); el.style.display = notesOpen ? 'block' : 'none';
  if (!notesOpen) return;
  const rows = Object.keys(state.heard).sort((a, b) => state.heard[a].n - state.heard[b].n).map(k => {
    const r = RUMORS[k];
    return '<p><b>' + r.title + '</b><br>' + r.note + '<br><i>Сообщил: ' + r.who + (r.firsthand ? '' : ' (с чужих слов, источник: ' + r.source + ')') + '</i></p>';
  });
  const pr = Object.keys(state.promises).map(k => '<p><b>Обещание:</b> ' + PROMISES[k].title + ' — ' + (state.promises[k].done ? 'выполнено' : 'не выполнено') + '</p>');
  el.innerHTML = '<h3>Заметки</h3>' + (rows.concat(pr).join('') || '<p>Пока пусто.</p>') + '<p><i>N — закрыть</i></p>';
}

// ================= ОБНОВЛЕНИЕ =================
function update(dt) {
  player.moving = false;
  if (dlg || notesOpen) return;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  const mx = dx * player.speed * dt, my = dy * player.speed * 0.5 * dt;
  player.x = Math.min(Math.max(player.x + mx, FLOOR.l), FLOOR.r);
  player.y = Math.min(Math.max(player.y + my, FLOOR.top), FLOOR.bot);
  const d = Math.hypot(mx, my);
  if (d > 0) { player.moving = true; player.dist += d; }   // кадр ходьбы зависит от пройденного пути
  if (dx !== 0) player.dir = dx;
}

// ================= РИСОВАНИЕ =================
const rect = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
function shelf(x, y, n) {
  const cols = ['#a33', '#c93', '#5a8', '#ca8'];
  for (let r = 0; r < 3; r++) {
    rect('#2a1a0e', x, y + 9 + r * 20, n * 13 + 5, 2);
    for (let i = 0; i < n; i++) rect(cols[(i + r) % 4], x + 4 + i * 13, y + r * 20, 5, 9);
  }
}
// Заглушка-человечек (ростом ~66 px, как будущие спрайты). Нужна для покупателей и пока нет картинок Андрея.
function person(x, y, color, swing, dir) {
  x = Math.round(x); y = Math.round(y);
  rect('#1d1510', x - 8 + swing, y - 22, 6, 22);
  rect('#1d1510', x + 2 - swing, y - 22, 6, 22);
  rect(color, x - 11, y - 50, 22, 28);
  rect('#e0b890', x - 7, y - 66, 14, 16);
  rect('#2a1a0e', x + (dir > 0 ? 2 : -7), y - 60, 5, 3);
  rect('#d8d0b0', x - 2 - swing, y - 48, 5, 20);
}
function drawAndrey() {
  const A = ANDREY, p = player, img = p.moving ? spr.walk : spr.idle;
  const cycle = (p.dist / A.cycleDistance) % 1;            // 0..1 внутри цикла ходьбы
  if (!img.ok) {                                           // картинки нет — заглушка
    person(p.x, p.y, '#6b8a3a', p.moving ? Math.round(Math.sin(cycle * 2 * Math.PI) * 5) : 0, p.dir);
    return;
  }
  const f = p.moving ? Math.floor(cycle * A.walk.frames) : 0;
  const px = Math.round(p.x), py = Math.round(p.y) - A.floorY;
  ctx.save();
  ctx.translate(px, 0);
  if (p.dir < 0) ctx.scale(-1, 1);                         // влево — зеркало (вправо рисуем как есть)
  ctx.drawImage(img, f * A.cellW, 0, A.cellW, A.cellH, -A.anchorX, py, A.cellW, A.cellH);
  ctx.restore();
}
function drawGoods() {                                     // каждая штука товара — квадрат на прилавке
  Object.keys(GOODS).forEach((k, i) => {
    for (let n = 0; n < state.stock[k]; n++)
      rect(GOODS[k].color, 143 + i * 40 + (n % 4) * 4, 95 - Math.floor(n / 4) * 4, 3, 3);
  });
}
function draw() {
  rect('#3a2819', 0, 0, W, 120);                           // стена
  rect('#7a5836', 0, 120, W, H - 120);                     // пол
  rect('#1c3a5c', 27, 27, 33, 40);                         // окно
  shelf(73, 27, 6); shelf(167, 27, 11);                    // полки
  rect('#3b2616', 133, 100, 180, 24);                      // прилавок
  drawGoods();
  rect('#8a2a2a', 80, 159, 153, 8);                        // ковёр
  const list = [{ y: player.y, f: drawAndrey }];
  if (pavelHere() || dlg) list.push({ y: spot.y, f: () => person(spot.x, spot.y, P.color, 0, -1) });
  list.push({ y: momSpot.y, f: () => person(momSpot.x, momSpot.y, '#8a5a5a', 0, 1) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());      // кто ниже по экрану — рисуется позже
  rect('#17100a', 0, 159, 40, 21); rect('#17100a', 273, 155, 47, 25);   // передний план
  $('hud').textContent = 'Монет: ' + state.money;
  $('dbg').textContent = problems.join(' | ');
  const h = $('hint');
  const msg = nearPavel() || nearMom() ? 'E — поговорить' : nearCounter() ? 'E — осмотреть товары' : '';
  h.style.display = msg ? 'block' : 'none'; h.textContent = msg;
}

// ================= ГЛАВНЫЙ ЦИКЛ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
renderDlg(); renderNotes(); requestAnimationFrame(loop);
</script>
</body>
</html>
